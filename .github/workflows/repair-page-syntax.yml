name: Repair page syntax

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed template literals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/page.tsx')
          s = p.read_text()
          # Fix one or more stray backslashes immediately before template-literal backticks.
          fixed = re.sub(r'(?m)(const styles=)\\+`', r'\1`', s)
          fixed = re.sub(r'(?m)^\\+`;', '`;', fixed)
          if fixed != s:
              p.write_text(fixed)
              print('Repaired malformed template literal')
          else:
              print('No malformed template literal found')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair malformed page template literal'
          git push
