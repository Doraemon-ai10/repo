name: Patch native APK UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[native-ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch local native UI
        run: python3 .github/native_patch.py
      - name: Add generated icon asset
        run: |
          mkdir -p android/app/src/main/assets
          echo '' | base64 -d > android/app/src/main/assets/rblxfinder_icon.png
      - name: Commit patched UI
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/assets/index.html android/app/src/main/assets/rblxfinder_icon.png
          git diff --cached --quiet || git commit -m "Update native APK UI and icon [native-ui-patch]"
          git push
