name: Build RBLXFinder Native Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-native-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Verify Android project
        run: |
          set -e
          test -f android/settings.gradle.kts
          test -f android/build.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/noobie/rblxfinder/MainActivity.kt
          test -f android/app/src/main/assets/index.html
          printf '%s\n' 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' 'org.gradle.parallel=true' 'org.gradle.caching=true' 'android.useAndroidX=true' 'android.nonTransitiveRClass=true' > android/gradle.properties

      - name: Build native release APK
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -e
          test -s android/app/build/outputs/apk/release/app-release.apk
          file android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare artifact
        run: |
          set -e
          mkdir -p apk-output
          cp android/app/build/outputs/apk/release/app-release.apk apk-output/RBLXFinder-Noobie-v2.0.0.apk
          ls -lh apk-output/RBLXFinder-Noobie-v2.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RBLXFinder-Native-Android-APK
          path: apk-output/RBLXFinder-Noobie-v2.0.0.apk
          retention-days: 30
