name: Build RBLXFinder Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-native-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Verify source
        run: |
          set -eux
          test -s android/settings.gradle.kts
          test -s android/build.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/java/com/noobie/rblxfinder/MainActivity.kt
          test -s android/app/src/main/assets/index.html
      - name: Create release signing key
        run: |
          set -eux
          keytool -genkeypair -v \
            -keystore android/release.keystore \
            -alias rblxfinder \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rblxfinder-build -keypass rblxfinder-build \
            -dname "CN=Noobie,O=RBLXFinder,C=VN"
      - name: Build signed release APK
        run: |
          set -eux
          gradle -p android :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          set -eux
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p apk-output
          cp "$APK" apk-output/RBLXFinder-Noobie-v2.0.0.apk
          sha256sum apk-output/RBLXFinder-Noobie-v2.0.0.apk
          ls -lh apk-output/RBLXFinder-Noobie-v2.0.0.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: RBLXFinder-Noobie-v2.0.0-APK
          path: apk-output/RBLXFinder-Noobie-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30
