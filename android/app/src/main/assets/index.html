:#8fa9c4;font-size:12px;line-height:1.5}.form{display:flex;gap:7px}.input,.area,select{width:100%;border:1px solid #274766;background:#071426;color:#eef6ff;border-radius:11px;padding:11px 12px;outline:none}.area{min-height:90px}.btn{border:0;border-radius:11px;padding:10px 13px;background:#117cf2;color:white;font-weight:850}.btn.secondary{background:#102943;border:1px solid #285071}.btn.purple{background:#7c3aed}.btn.green{background:#079669}.row{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #183654;border-radius:13px;margin-top:8px;background:#08182b}.grow{flex:1;min-width:0}.small{border:1px solid #284967;border-radius:9px;padding:7px 9px;background:#102943;color:#d8ebff;font-weight:800;font-size:11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.stat{padding:11px;border-radius:12px;background:#07182b;border:1px solid #173754;text-align:center}.stat b{display:block;font-size:20px;color:#4fc3ff}.notice{padding:11px;border-radius:12px;background:#062d28;border:1px solid #087b6d;color:#74f2d6;font-weight:800;margin-bottom:12px}.error{padding:11px;border-radius:12px;background:#3b1320;border:1px solid #8b2e49;color:#ff9bb5;font-weight:800;margin-bottom:12px}.leader{display:grid;gap:7px}.rank{width:28px;height:28px;display:grid;place-items:center;border-radius:9px;background:#103a62;font-weight:950;color:#70d2ff}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.chip{padding:5px 8px;border-radius:99px;background:#0c2b4b;color:#71c8ff;font-size:10px;font-weight:800}.target{height:220px;border-radius:18px;background:radial-gradient(circle,#0f4b77,#071426 70%);display:grid;place-items:center;border:1px solid #1c537a}.target button{width:72px;height:72px;border-radius:50%;border:8px solid #ff426c;background:#eefaff;color:#06203b;font-size:22px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #183654;text-align:left;font-size:12px}.footer{text-align:center;color:#66809b;font-size:10px;margin-top:28px}.avatar{width:42px;height:42px;border-radius:12px;object-fit:cover;background:#123a61}.post{display:flex;gap:10px}.postbody{flex:1}.commentbox{display:flex;gap:7px;margin-top:8px}.commentbox input{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#061426ee;border-top:1px solid #173552;display:flex;justify-content:space-around;padding:7px 6px env(safe-area-inset-bottom)}.bottom button{border:0;background:transparent;color:#7793ae;font-size:10px;font-weight:800;padding:4px 8px}.bottom button.on{color:#53c8ff}.modal{position:fixed;inset:0;z-index:100;background:#020711cc;display:grid;place-items:center;padding:18px}.modalBox{width:min(480px,100%);max-height:88vh;overflow:auto;background:#091a31;border:1px solid #245174;border-radius:22px;padding:17px}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead button{border:0;background:#102943;color:white;border-radius:9px;width:34px;height:34px;font-size:20px}.settingGrid{display:grid;gap:9px}.settingGrid button{padding:12px;border:1px solid #244a68;background:#0c2138;color:#d9ecff;border-radius:12px;text-align:left}.hidden{display:none!important}@media(max-width:560px){.hero h1{font-size:27px}.grid{grid-template-columns:1fr}.brand{font-size:18px}.brand img{width:34px;height:34px}.tabs button{padding:8px 10px}}</style></head><body><div class="app"><header class="top"><div class="brand"><img src="rblxfinder-icon.webp"><b>RBLXFinder</b><span>NOOBIE GAMING HUB</span><button class="small" style="margin-left:auto" onclick="openSettings()">⚙</button></div><nav id="tabs" class="tabs"></nav></header><main id="app" class="wrap"></main><nav id="bottom" class="bottom"></nav></div><script>const API='https://repo-ttdo.vercel.app/api/roblox',AI='https://repo-ttdo.vercel.app/api/assistant',CREATOR_API='https://repo-ttdo.vercel.app/api/creator',SB='https://mbsnpcdmenfufhbctoek.supabase.co',KEY='sb_publishable_rwwoH9hpk6cg3woGveNObw_C00pNZsx',FF_CREATOR_ID='2035971642',FF_TOPUP='https://napthe.vn/?channel=205000',DISCORD='https://discord.gg/nePuZm3kcu',YOUTUBE='https://youtube.com/@noobieroblox_vn';const devices={'OPPO A9 2020':[180,440,47],'iPhone 11':[188,0,48],'iPhone 13':[194,0,49],'iPhone 15 Pro':[200,0,50],'Samsung A54':[192,480,49],'Samsung S24':[192,520,49],'Xiaomi Redmi Note 13':[182,480,48],'vivo V40':[194,520,50],'realme 12':[194,520,50]};let tab='home',xp=+localStorage.rblx_xp||0,streak=+localStorage.rblx_streak||1,saved=JSON.parse(localStorage.rblx_saved_games||'[]'),games=[],servers=[],compare=[],user=null,posts=[],plusUserId=+localStorage.plusUserId||0,plus=false,creatorSession=false,creatorPassword='',notice='',error='',score=0,hits=0,shots=0,device='OPPO A9 2020',general=180,fire=47,dpi=440,filter='';const navItems=[['home','Trang chủ'],['roblox','Roblox'],['plus','⭐ Plus'],['creator','👑 Creator'],['freefire','Free Fire'],['community','Cộng đồng'],['daily','Daily'],['compare','So sánh'],['about','Giới thiệu']],bottomItems=[['home','⌂'],['roblox','Roblox'],['freefire','FF'],['community','Cộng đồng'],['about','☰']];function addXp(n){xp+=n;localStorage.rblx_xp=xp}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(m,isErr=false){if(isErr)error=m;else notice=m;render();setTimeout(()=>{notice='';error='';render()},2600)}function go(x){tab=x;error='';notice='';render();scrollTo(0,0)}function nav(){document.querySelector('#tabs').innerHTML=navItems.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');document.querySelector('#bottom').innerHTML=bottomItems.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}async function req(url,body){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'API error');return d}async function postRb(body){return req(API,body)}function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}async function findUser(){let v=document.querySelector('#username').value.trim();if(!v)return toast('Nhập username Roblox',true);try{user=await postRb({action:'username',username:v});addXp(10);toast('Đã tìm thấy Roblox user')}catch(e){toast('Không tìm thấy username Roblox',true)}render()}async function findGames(){let v=document.querySelector('#gameq').value.trim();if(!v)return toast('Nhập tên game',true);try{let d=await postRb({action:'games',q:v});games=d.games||d.data||[];addXp(15)}catch(e){toast('Không tải được game',true)}render()}async function findServers(){let v=Number(document.querySelector('#serverq').value);if(!v)return toast('Nhập Universe ID',true);try{let d=await postRb({action:'servers',universeId:v});servers=d.data||[];addXp(10)}catch(e){toast('Không tải được server',true)}render()}function saveGame(id){id=String(id);saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.rblx_saved_games=JSON.stringify(saved);addXp(3);render()}function cmp(id){let g=games.find(x=>x.id==id);if(!g)return;compare=compare.some(x=>x.id==id)?compare.filter(x=>x.id!=id):compare.length<4?[...compare,g]:compare;render()}async function plusStatus(){if(!plusUserId)return;try{let d=await req(CREATOR_API,{action:'status',userId:plusUserId});plus=!!(d.plus||d.active)}catch{plus=false}}async function resolvePlus(){let v=document.querySelector('#plususername').value.trim();if(!v)return toast('Nhập username Roblox',true);try{let d=await req(CREATOR_API,{action:'resolve',username:v});plusUserId=Number(d.user.id);localStorage.plusUserId=plusUserId;await plusStatus();toast('Đã liên kết User ID '+plusUserId)}catch(e){toast('Không tìm thấy Roblox username',true)}render()}async function creatorLogin(){let u=document.querySelector('#creatoruser').value.trim(),p=document.querySelector('#creatorpass').value;if(!u||!p)return toast('Nhập Creator username và mật khẩu',true);try{let d=await req(CREATOR_API,{action:'creator-login',username:u,password:p});if(!d.ok&&!d.authenticated&&!d.success)throw Error();creatorSession=true;creatorPassword=p;toast('Creator đăng nhập thành công')}catch(e){toast('Sai thông tin Creator',true)}render()}async function recordDonation(){if(!creatorSession)return;let username=document.querySelector('#donateuser').value.trim(),id=Number(document.querySelector('#donateid').value),amount=Number(document.querySelector('#donateamount').value),note=document.querySelector('#donatenote').value.trim();if(!username||!id||amount<=0)return toast('Điền đủ User ID, username và số Robux',true);try{await req(CREATOR_API,{action:'record-donation',username,password:creatorPassword,userId:id,robloxUsername:username,amount,note});toast('Đã ghi nhận '+amount.toLocaleString()+' Robux')}catch(e){toast('Không ghi nhận donation: '+e.message,true)}render()}async function grantPlus(){if(!creatorSession)return;let u=document.querySelector('#grantuser').value.trim();if(!u)return toast('Nhập username cần cấp Plus',true);try{let d=await req(CREATOR_API,{action:'grant',username:u,password:creatorPassword,note:document.querySelector('#grantnote').value.trim()});toast('Đã cấp Plus cho '+(d.user?.name||u))}catch(e){toast('Không cấp Plus: '+e.message,true)}render()}async function leaderboard(){try{let r=await fetch(CREATOR_API+'?action=leaderboard');return r.ok?await r.json():[]}catch{return[]}}async function loadPosts(kind){let table=kind==='ff'?'ff_posts':'rb_posts';let r=await fetch(SB+'/rest/v1/'+table+'?select=*&order=created_at.desc&limit=50',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});return r.ok?await r.json():[]}async function communityLoad(){posts=await loadPosts('rb');render()}async function ffCommunityLoad(){posts=await loadPosts('ff');render()}async function createPost(kind){let title=document.querySelector('#ptitle').value.trim(),body=document.querySelector('#pbody').value.trim();if(!body)return toast('Nhập nội dung',true);let table=kind==='ff'?'ff_posts':'rb_posts';let payload=kind==='ff'?{display_name:'RBLXFinder Mobile',body,category:'Preset',device,general,fire_button:fire,dpi}:{display_name:'RBLXFinder Mobile',title:title||'Thảo luận',body,category:'Thảo luận'};try{let r=await fetch(SB+'/rest/v1/'+table,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});if(!r.ok)throw Error();toast('Đã đăng bài');kind==='ff'?await ffCommunityLoad():await communityLoad()}catch(e){toast('Không đăng được bài',true)}}async function likePost(kind,id){let rpc=kind==='ff'?'toggle_ff_like':'toggle_rb_like';let r=await fetch(SB+'/rest/v1/rpc/'+rpc,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_post_id:id,p_visitor_id:visitor()})});if(r.ok)toast('Đã cập nhật lượt thích');else toast('Không thể thích bài',true)}function visitor(){let x=localStorage.rblx_visitor_id;if(!x){x=crypto.randomUUID?crypto.randomUUID():String(Date.now());localStorage.rblx_visitor_id=x}return x}async function commentPost(kind,id){let v=document.querySelector('#comment-'+id).value.trim();if(!v)return;let table=kind==='ff'?'ff_comments':'rb_comments';let r=await fetch(SB+'/rest/v1/'+table,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({post_id:id,display_name:'Người chơi',body:v,moderation_status:'approved'})});if(r.ok){document.querySelector('#comment-'+id).value='';toast('Đã gửi bình luận')}else toast('Bình luận bị từ chối',true)}function setDevice(v){device=v;let p=devices[v]||devices['OPPO A9 2020'];general=p[0];dpi=p[1];fire=p[2];render()}function shoot(){shots++;if(Math.random()>.25){hits++;score=Math.min(100,score+4);addXp(2)}else score=Math.max(0,score-1);render()}async function askAI(){let q=prompt('Bạn muốn hỏi AI điều gì?');if(!q)return;try{let d=await req(AI,{message:q,game:tab==='freefire'?'freefire':'roblox'});alert(d.reply||d.message||'AI chưa trả lời')}catch(e){alert('AI hiện không kết nối được')}}function ffDonate(){let id=document.querySelector('#ffuid').value.trim();if(!/^\d{6,15}$/.test(id))return toast('Hãy nhập Free Fire ID của bạn',true);window.open(FF_TOPUP,'_blank','noopener,noreferrer')}function openSettings(){document.querySelector('#settings').classList.remove('hidden')}function closeSettings(){document.querySelector('#settings').classList.add('hidden')}function setTheme(t){localStorage.rblx_native_theme=t;document.body.dataset.theme=t;document.body.style.background=t==='blue'?'#041a35':t==='purple'?'#160a2d':t==='light'?'#f4f8fc':'#071326'}function render(){nav();let b='';if(tab==='home')b=`<section class="hero"><div class="heroLogo"><img src="rblxfinder-icon.webp"><div><div class="badge">NATIVE APP · NOOBIE</div><h1>RBLXFinder<br>NOOBIE GAMING HUB</h1></div></div><p>Roblox + Free Fire trong một ứng dụng. UI chạy local trong APK, không mở Vercel. Internet chỉ dùng khi cần API, AI hoặc Community.</p><div class="grid"><button class="btn" onclick="go('roblox')">🔎 Roblox Tools</button><button class="btn" onclick="go('freefire')">🎯 Free Fire Lab</button><button class="btn purple" onclick="go('plus')">⭐ Plus Center</button><button class="btn secondary" onclick="askAI()">🤖 AI Assistant</button></div></section><div class="grid">${card('🏆 Level & XP',`<b style="font-size:29px">${Math.floor(xp/100)+1}</b><p class="muted">${xp%100}/100 XP · 🔥 ${streak} ngày</p>`)}${card('⭐ Saved Games',`<b style="font-size:29px">${saved.length}</b><p class="muted">Lưu ngay trên thiết bị</p>`)}${card('🛡️ Plus',plus?'<b>Đang hoạt động</b><p class="muted">Plus đã được Creator cấp sau donation.</p>':'<b>Free-first</b><p class="muted">Roblox cơ bản vẫn miễn phí.</p>')}</div><div class="grid">${card('🌐 Global Search',`<p class="muted">Tìm Roblox Tools, Free Fire Lab, AI, Community, Donate và các công cụ.</p><button class="btn secondary" onclick="go('about')">Xem toàn bộ</button>`)}${card('🔗 Creator',`<button class="btn secondary" onclick="window.open('${DISCORD}')">Discord</button> <button class="btn secondary" onclick="window.open('${YOUTUBE}')">YouTube</button>`)}</div>`;if(tab==='roblox')b=`<h2>🎮 Roblox Power Tools</h2><div class="grid">${card('👤 Profile Scanner',`<div class="form"><input id="username" class="input" placeholder="Username Roblox"><button class="btn" onclick="findUser()">Tìm</button></div>${user?`<div class="row"><div class="grow"><b>${esc(user.displayName)}</b> <span class="muted">@${esc(user.name)}</span><div class="muted">User ID: ${user.id}</div></div><button class="small" onclick="plusUserId=${user.id};localStorage.plusUserId=${user.id};go('plus')">⭐ Plus</button></div>`:''}`)}${card('🎮 Game Intelligence',`<div class="form"><input id="gameq" class="input" placeholder="Tên game"><button class="btn" onclick="findGames()">Tìm</button></div><div class="list">${games.slice(0,20).map(g=>`<div class="row"><div class="grow"><b>${esc(g.name)}</b><div class="muted">👥 ${(g.playing||0).toLocaleString()} · ⭐ ${(g.favorites||0).toLocaleString()} · Visits ${(g.visits||0).toLocaleString()}</div></div><button class="small" onclick="cmp(${g.id})">${compare.some(x=>x.id==g.id)?'✓':'＋'}</button><button class="small" onclick="saveGame(${g.id})">${saved.includes(String(g.id))?'★':'☆'}</button></div>`).join('')}</div>`)}${card('🖥️ Low-Pop Server Finder',`<p class="muted">Free: lọc cơ bản. Plus: dùng các bộ lọc nâng cao khi backend/feature tương ứng khả dụng.</p><div class="form"><input id="serverq" class="input" inputmode="numeric" placeholder="Universe ID"><button class="btn" onclick="findServers()">Tìm</button></div><div class="list">${servers.slice().sort((a,b)=>(a.playing||999)-(b.playing||999)).slice(0,40).map(s=>`<div class="row"><b>${s.playing||0}/${s.maxPlayers||'?'}</b><span class="grow muted">${esc(s.id||'')}</span><button class="small" onclick="navigator.clipboard?.writeText('${esc(s.id||'')}');toast('Đã copy Server ID')">Copy</button></div>`).join('')}</div>`)}</div>`;if(tab==='plus')b=`<h2>⭐ RBLXFinder Plus</h2><p class="muted">Plus yêu cầu donate Robux cho Creator <b>khoungbell7777</b> trước. Creator xác nhận donation rồi mới cấp Plus. Không dùng xác minh bio/profile.</p><div class="grid">${card('👤 Liên kết Roblox',`<input id="plususername" class="input" placeholder="Username Roblox"><button class="btn" style="margin-top:8px" onclick="resolvePlus()">Kiểm tra</button><p class="muted">User ID đang liên kết: ${plusUserId||'chưa có'}</p>`)}${card('⭐ Trạng thái',`<b>${plus?'PLUS ACTIVE':'FREE'}</b><p class="muted">${plus?'Các công cụ nâng cao được mở theo backend.':'Tính năng Roblox cơ bản vẫn dùng miễn phí.'}</p>`)}</div><div class="grid">${card('💎 Plus có gì?',`<div class="chips"><span class="chip">Advanced Low-Pop</span><span class="chip">Auto Refresh</span><span class="chip">Server Watcher</span><span class="chip">Saved Alerts</span><span class="chip">Game Intelligence</span><span class="chip">Compare</span><span class="chip">Player Trends</span><span class="chip">Advanced Profile</span><span class="chip">Shortcuts</span></div>`)}${card('🏆 Donation Leaderboard',`<div id="leaderboard" class="leader"><button class="btn secondary" onclick="loadLeader()">Tải bảng xếp hạng</button></div>`)}</div>`;if(tab==='creator')b=`<h2>👑 Creator Dashboard</h2>${creatorSession?`<div class="notice">Creator session đang hoạt động. Mật khẩu chỉ nằm trong bộ nhớ của app.</div><div class="grid">${card('💰 Ghi nhận donation',`<input id="donateuser" class="input" placeholder="Roblox username"><input id="donateid" class="input" style="margin-top:7px" placeholder="Roblox User ID" inputmode="numeric"><input id="donateamount" class="input" style="margin-top:7px" placeholder="Robux đã nhận" inputmode="numeric"><input id="donatenote" class="input" style="margin-top:7px" placeholder="Ghi chú"><button class="btn green" style="margin-top:8px" onclick="recordDonation()">Ghi nhận</button>`)}${card('⭐ Cấp Plus',`<input id="grantuser" class="input" placeholder="Roblox username"><input id="grantnote" class="input" style="margin-top:7px" placeholder="Ghi chú"><button class="btn purple" style="margin-top:8px" onclick="grantPlus()">Cấp Plus</button>`)}</div><div class="card" style="margin-top:13px"><button class="btn secondary" onclick="loadLeader()">Xem leaderboard donation</button><div id="leaderboard" class="leader" style="margin-top:9px"></div></div>`:`<div class="card"><input id="creatoruser" class="input" value="khoungbell7777" placeholder="Creator username"><input id="creatorpass" class="input" style="margin-top:7px" type="password" placeholder="Creator password"><button class="btn purple" style="margin-top:8px" onclick="creatorLogin()">Đăng nhập Creator</button><p class="muted">Không lưu mật khẩu vào localStorage.</p></div>`}`;if(tab==='freefire')b=`<h2>🎯 Free Fire Hub</h2><div class="grid">${card('📱 Sensitivity Lab',`<select class="input" onchange="setDevice(this.value)">${Object.keys(devices).map(x=>`<option ${x===device?'selected':''}>${x}</option>`).join('')}</select><div class="stats"><div class="stat"><b>${general}</b>General</div><div class="stat"><b>${Math.max(0,general-8)}</b>Red Dot</div><div class="stat"><b>${dpi||'Auto'}</b>DPI</div></div><label class="muted">General</label><input class="range" type="range" min="100" max="200" value="${general}" oninput="general=+this.value;render()"><label class="muted">Fire Button</label><input class="range" type="range" min="35" max="65" value="${fire}" oninput="fire=+this.value;render()"><label class="muted">DPI</label><input class="range" type="range" min="0" max="1000" value="${dpi}" oninput="dpi=+this.value;render()"><button class="btn" style="margin-top:8px" onclick="navigator.clipboard?.writeText('Free Fire ${device} | General ${general} | Red Dot ${Math.max(0,general-8)} | 2x ${Math.max(0,general-20)} | 4x ${Math.max(0,general-34)} | AWM ${Math.max(0,general-52)} |
