<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f8fafc"><title>RBLXFinder — Noobie</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fbff,#fff);color:#111827;font-family:Inter,system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:9;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid #e5e7eb;padding:12px 14px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px}.badge{font-size:10px;padding:5px 8px;border-radius:99px;background:#eff6ff;color:#2563eb}.tabs{display:flex;gap:7px;overflow:auto;margin-top:11px;padding-bottom:2px}.tabs button{white-space:nowrap;padding:9px 12px;border-radius:11px;background:#f1f5f9;color:#334155;font-weight:800}.tabs button.on{background:#111827;color:#fff}.wrap{max-width:980px;margin:auto;padding:18px 14px 70px}.hero{padding:24px 19px;border-radius:24px;background:linear-gradient(135deg,#111827,#2563eb);color:#fff;box-shadow:0 16px 45px #1e3a8a22}.hero h1{font-size:34px;line-height:1.05;margin:8px 0}.hero p{line-height:1.55;opacity:.88}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.light,.dark,.purple{padding:11px 14px;border-radius:11px;font-weight:900}.primary{background:#fff;color:#111827}.light{background:#ffffff1c;color:#fff;border:1px solid #ffffff44}.dark{background:#111827;color:#fff}.purple{background:#7c3aed;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px;margin-top:15px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:15px;box-shadow:0 7px 25px #0f172a08}.card h3{margin:0 0 11px}.muted{color:#64748b;font-size:13px;line-height:1.5}.row{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #e8edf3;border-radius:13px;margin-top:8px}.row .grow{flex:1}.input,.area{width:100%;padding:11px 12px;border:1px solid #dbe1e8;border-radius:11px;background:#fff;outline:none}.area{min-height:90px;resize:vertical}.form{display:flex;gap:7px}.form .input{flex:1}.small{padding:8px 9px;border-radius:9px;background:#f1f5f9;color:#334155;font-weight:800;font-size:12px}.stat{padding:12px;border-radius:13px;background:#f8fafc;text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.error{padding:11px;border-radius:12px;background:#fef2f2;color:#b91c1c;font-weight:700;margin-bottom:12px}.ok{padding:11px;border-radius:12px;background:#ecfdf5;color:#047857;font-weight:700;margin-bottom:12px}.target{height:210px;border-radius:18px;background:radial-gradient(circle,#dbeafe,#f8fafc);display:grid;place-items:center}.target button{width:72px;height:72px;border-radius:50%;border:8px solid #ef4444;background:#fff;font-size:24px}.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:35px}.pill{display:inline-block;padding:5px 8px;background:#eef2ff;color:#4338ca;border-radius:99px;font-size:11px;font-weight:800}.gold{background:#fff7ed;color:#c2410c}.hide{display:none}.danger{color:#b91c1c}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}.link{color:#2563eb;font-weight:800}</style></head><body><header class="top"><div class="brand">⚡ RBLXFinder <span class="badge">NOOBIE GAMING HUB</span></div><nav class="tabs" id="tabs"></nav></header><main class="wrap" id="app"></main><script>
const API='https://repo-ttdo.vercel.app/api/roblox',AI='https://repo-ttdo.vercel.app/api/assistant',CREATOR_API='https://repo-ttdo.vercel.app/api/creator';const FF_CREATOR_ID='2035971642',FF_TOPUP='https://napthe.vn/?channel=205000';let tab='home',xp=+localStorage.xp||0,streak=+localStorage.streak||1,saved=JSON.parse(localStorage.saved||'[]'),games=[],servers=[],compare=[],user=null,err='',notice='',plusUserId=+localStorage.plusUserId||0,plus=false,creatorSession=false,creatorPassword='',posts=[];
const tabs=[['home','Home'],['roblox','Roblox'],['plus','⭐ Plus'],['creator','👑 Creator'],['freefire','Free Fire'],['community','Community'],['daily','Daily'],['compare','Compare'],['about','About']];
function nav(){document.querySelector('#tabs').innerHTML=tabs.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')};function go(x){tab=x;err='';notice='';render()};function add(n){xp+=n;localStorage.xp=xp}
async function request(url,body){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'API error');return d};async function post(body){return request(API,body)}
async function findUser(){let v=document.querySelector('#username').value.trim();if(!v)return;try{user=await post({action:'username',username:v});add(10)}catch(e){err='Không tìm thấy username Roblox.'}render()};async function findGames(){let v=document.querySelector('#gameq').value.trim();if(!v)return;try{let d=await post({action:'games',q:v});games=d.games||d.data||[];add(15)}catch(e){err='Không tải được game.'}render()};async function findServers(){let v=+document.querySelector('#serverq').value;if(!v)return;try{let d=await post({action:'servers',universeId:v});servers=d.data||[];add(10)}catch(e){err='Không tải được server.'}render()};function save(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.saved=JSON.stringify(saved);add(3);render()};function cmp(id){let g=games.find(x=>x.id==id);if(!g)return;compare=compare.some(x=>x.id==id)?compare.filter(x=>x.id!=id):compare.length<4?[...compare,g]:compare;render()};function shoot(){let hit=Math.random()>.25,s=+localStorage.shots||0,h=+localStorage.hits||0,sc=+localStorage.score||0;localStorage.shots=s+1;if(hit){localStorage.hits=h+1;localStorage.score=Math.min(100,sc+4);add(2)}else localStorage.score=Math.max(0,sc-1);render()};function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}
async function plusStatus(){if(!plusUserId)return;try{let d=await request(CREATOR_API,{action:'status',userId:plusUserId});plus=!!(d.plus||d.active);if(!plus){localStorage.removeItem('plusUserId');plusUserId=0}}catch(e){}}async function resolvePlusUser(){let v=document.querySelector('#plususername').value.trim();if(!v)return;try{let d=await request(CREATOR_API,{action:'resolve',username:v});plusUserId=Number(d.user.id);localStorage.plusUserId=plusUserId;await plusStatus();notice=`Đã liên kết Roblox User ID ${plusUserId}. Donate cho Creator rồi Creator mới cấp Plus.`;render()}catch(e){err='Không tìm thấy Roblox username.';render()}}
async function creatorLogin(){let u=document.querySelector('#creatoruser').value.trim(),p=document.querySelector('#creatorpass').value;if(!u||!p)return;try{let d=await request(CREATOR_API,{action:'creator-login',username:u,password:p});if(d.ok||d.authenticated||d.success){creatorSession=true;creatorPassword=p;notice='👑 Creator đã đăng nhập.';render()}else throw Error()}catch(e){err='Sai thông tin Creator hoặc backend chưa cấu hình.';render()}}
async function recordDonation(){if(!creatorSession)return;let u=document.querySelector('#donateuser').value.trim(),amount=Number(document.querySelector('#donateamount').value);if(!u||!amount)return;try{let d=await request(CREATOR_API,{action:'record-donation',username:u,password:creatorPassword,userId:Number(document.querySelector('#donateid').value),robloxUsername:u,amount,note:document.querySelector('#donatenote').value.trim()});notice=`💰 Đã ghi nhận ${amount.toLocaleString()} Robux donate cho ${u}.`;render()}catch(e){err='Không ghi nhận donation: '+e.message;render()}}
async function grantPlus(){if(!creatorSession)return;let u=document.querySelector('#grantuser').value.trim(),note=document.querySelector('#grantnote').value.trim();if(!u)return;try{let d=await request(CREATOR_API,{action:'grant',username:u,password:creatorPassword,note});notice=`⭐ Đã cấp Plus cho ${d.user?.name||u} (User ID ${d.user?.id||''}).`;render()}catch(e){err='Không cấp Plus được: '+e.message;render()}}
async function askAI(){let q=prompt('Bạn muốn hỏi AI điều gì?');if(!q)return;try{let d=await request(AI,{message:q,game:tab==='freefire'?'freefire':'roblox'});alert(d.reply||d.message||'AI chưa trả lời.')}catch(e){alert('AI hiện không kết nối được.')}}
function openFFDonate(){let id=document.querySelector('#ffuid')?.value.trim();if(!/^\d{6,15}$/.test(id)){err='Hãy nhập Free Fire ID của bạn trước.';render();return}window.open(FF_TOPUP,'_blank','noopener,noreferrer')}
async function community(){let r=await fetch('https://mbsnpcdmenfufhbctoek.supabase.co/rest/v1/rb_posts?select=*&order=created_at.desc&limit=30',{headers:{apikey:'sb_publishable_rwwoH9hpk6cg3woGveNObw_C00pNZsx'}});posts=await r.json();render()};async function createPost(){let title=document.querySelector('#ptitle').value.trim(),body=document.querySelector('#pbody').value.trim();if(!title||!body)return;try{let r=await fetch('https://mbsnpcdmenfufhbctoek.supabase.co/rest/v1/rb_posts',{method:'POST',headers:{apikey:'sb_publishable_rwwoH9hpk6cg3woGveNObw_C00pNZsx','Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({title,body,author_name:'RBLXFinder Mobile'})});if(!r.ok)throw Error();notice='Đã đăng bài.';await community()}catch(e){err='Không đăng được bài community.';render()}}
function render(){nav();let body='';if(tab==='home')body=`<section class="hero"><span class="pill">NATIVE ANDROID • ${plus?'ROBLOX PLUS ACTIVE':'FREE'}</span><h1>Roblox + Free Fire<br>trong một app.</h1><p>RBLXFinder by Noobie — ứng dụng native, không mở Vercel hay trình duyệt. Công cụ online chỉ cần Internet khi truy vấn Roblox, AI hoặc Community.</p><div class="actions"><button class="primary" onclick="go('roblox')">🔎 Roblox Tools</button><button class="light" onclick="go('plus')">⭐ ${plus?'Plus Center':'Roblox Plus'}</button><button class="light" onclick="go('freefire')">🎯 Free Fire</button><button class="light" onclick="askAI()">🤖 AI</button></div></section><div class="grid">${card('🏆 Level & XP',`<b style="font-size:30px">${Math.floor(xp/100)+1}</b><p class="muted">${xp%100}/100 XP · 🔥 ${streak} ngày</p>`)}${card('⭐ Saved Games',`<b style="font-size:30px">${saved.length}</b><p class="muted">Lưu ngay trên thiết bị</p>`)}${card('🛡️ Roblox Plus',plus?'<b>Đang hoạt động</b><p class="muted">Plus được cấp sau khi Creator xác nhận donation.</p>':'<b>Chưa kích hoạt</b><p class="muted">Tính năng Roblox cơ bản vẫn miễn phí.</p>')}</div>`;
if(tab==='roblox')body=`<h2>🎮 Roblox Power Tools</h2><div class="grid">${card('👤 Profile Scanner',`<div class="form"><input class="input" id="username" placeholder="Username Roblox"><button class="dark" onclick="findUser()">Tìm</button></div>${user?`<div class="row"><div class="grow"><b>${user.displayName}</b> <span class="muted">@${user.name}</span><div class="muted">User ID: ${user.id}</div></div><button class="small" onclick="plusUserId=${user.id};localStorage.plusUserId=${user.id};go('plus')">⭐ Plus</button></div>`:''}`)}${card('🎮 Game Intelligence',`<div class="form"><input class="input" id="gameq" placeholder="Tên game"><button class="dark" onclick="findGames()">Tìm</button></div>${games.slice(0,15).map(g=>`<div class="row"><div class="grow"><b>${g.name}</b><div class="muted">👥 ${(g.playing||0).toLocaleString()} · ⭐ ${(g.favorites||0).toLocaleString()} · ID ${g.id}</div></div><button class="small" onclick="cmp(${g.id})">${compare.some(x=>x.id==g.id)?'✓':'＋'}</button><button class="small" onclick="save('${g.id}')">${saved.includes(String(g.id))?'★':'☆'}</button></div>`).join('')}`)}${card('🖥️ Low-Pop Server Finder',`<p class="muted">Tìm public server ít người, sắp xếp tăng dần.</p><div class="form"><input class="input" id="serverq" inputmode="numeric" placeholder="Universe ID"><button class="dark" onclick="findServers()">Tìm</button></div>${servers.slice().sort((a,b)=>(a.playing||999)-(b.playing||999)).slice(0,30).map(s=>`<div class="row"><b>${s.playing||0}/${s.maxPlayers||'?'}</b><span class="grow muted">${s.id||''}</span><button class="small" onclick="navigator.clipboard?.writeText('${s.id||''}');alert('Đã copy Server ID')">Copy</button></div>`).join('')}`)}</div>`;
if(tab==='plus')body=`<h2>⭐ Roblox Plus Center</h2><p class="muted">Roblox Plus là gói nâng cao của RBLXFinder. Để được cấp Plus, người dùng phải donate Robux cho Creator trước. Không còn cơ chế xác minh bằng bio/profile.</p><div class="grid">${card('👤 Roblox User ID',`<input class="input" id="plususername" placeholder="Username Roblox"><button class="dark" style="margin-top:8px" onclick="resolvePlusUser()">Liên kết User ID</button><p class="muted">Sau khi donate, Creator sẽ xác nhận và cấp Plus theo User ID.</p>`)}${card('💰 Quy trình nhận Plus',`<ol class="muted"><li>Tìm đúng Roblox username của bạn.</li><li>Donate Robux cho Creator.</li><li>Creator xác nhận donation.</li><li>Creator cấp RBLXFinder Plus.</li><li>App/web tự kiểm tra trạng thái Plus.</li></ol>`)}${card('🚀 Quyền Plus',`<ul class="muted"><li>Advanced low-pop filters</li><li>Auto refresh / Server Watcher</li><li>Saved server alerts</li><li>Advanced Game Intelligence</li><li>Game Compare & player trends</li><li>Advanced profile intelligence</li></ul>`)}</div>`;
if(tab==='creator')body=creatorSession?`<h2>👑 Creator Center</h2><div class="ok">Creator session đang hoạt động.</div><div class="grid">${card('💰 Ghi nhận Roblox Donation',`<input class="input" id="donateuser" placeholder="Username Roblox"><input class="input" id="donateid" inputmode="numeric" placeholder="Roblox User ID" style="margin-top:8px"><input class="input" id="donateamount" inputmode="numeric" placeholder="Số Robux đã nhận" style="margin-top:8px"><textarea class="area" id="donatenote" placeholder="Ghi chú" style="margin-top:8px"></textarea><button class="dark" style="margin-top:8px" onclick="recordDonation()">Ghi nhận donation</button>`)}${card('⭐ Cấp Roblox Plus',`<input class="input" id="grantuser" placeholder="Username người nhận"><textarea class="area" id="grantnote" placeholder="Ghi chú (tuỳ chọn)" style="margin-top:8px"></textarea><button class="purple" style="margin-top:8px" onclick="grantPlus()">Cấp Plus</button><p class="muted">Backend chỉ cho cấp Plus khi có donation đã ghi nhận.</p>`)}${card('🛡️ Quy trình',`<ol class="muted"><li>Creator đăng nhập.</li><li>Kiểm tra donation Robux thực tế.</li><li>Ghi nhận số Robux đã nhận.</li><li>Cấp Plus cho User ID tương ứng.</li></ol>`)}</div><button class="small" onclick="creatorSession=false;creatorPassword='';render()">Đăng xuất Creator</button>`:`<h2>👑 Creator Center</h2>${card('🔐 Creator Login',`<input class="input" id="creatoruser" placeholder="Creator Roblox username"><input class="input" id="creatorpass" type="password" placeholder="Creator password" style="margin-top:8px"><button class="purple" style="margin-top:8px" onclick="creatorLogin()">Đăng nhập</button>`)};
if(tab==='freefire')body=`<h2>🎯 Free Fire Gaming Center</h2><p class="muted">Free Fire tập trung vào công cụ chơi game, tối ưu thiết bị và hỗ trợ cộng đồng. Đây không phải hệ thống Plus.</p><div class="grid">${card('📱 Sensitivity Presets',`<select class="input"><option>OPPO A9 2020</option><option>iPhone 11</option><option>iPhone 13</option><option>iPhone 15 Pro</option><option>Samsung A54</option><option>Samsung S24</option><option>Redmi Note 13</option><option>vivo V40</option></select><div class="stats"><div class="stat"><b>General</b><br>194</div><div class="stat"><b>Red Dot</b><br>49</div><div class="stat"><b>DPI</b><br>Auto</div></div><button class="dark" onclick="navigator.clipboard?.writeText('Free Fire sensitivity preset');add(5);notice='Đã copy preset';render()">📋 Copy preset</button>`)}${card('🎯 Aim Challenge',`<p class="muted">Luyện phản xạ và theo dõi điểm số ngay trên app.</p><div class="target"><button onclick="shoot()">🎯</button></div><div class="stats"><div class="stat"><b>Score</b><br>${+localStorage.score||0}</div><div class="stat"><b>Hits</b><br>${+localStorage.hits||0}</div><div class="stat"><b>Shots</b><br>${+localStorage.shots||0}</div></div>`)}${card('🎛️ HUD Builder',`<input style="width:100%" type="range" min="35" max="65" value="50" oninput="document.querySelector('#fire').style.width=this.value+'px';document.querySelector('#fire').style.height=this.value+'px'"><div style="height:110px;background:#0f172a;border-radius:15px;display:grid;place-items:center"><div id="fire" style="width:50px;height:50px;border-radius:50%;background:#ef4444;color:white;display:grid;place-items:center;font-weight:900">FIRE</div></div>`)}${card('💎 Hỗ trợ Creator Free Fire',`<p class="muted">Muốn ủng hộ Creator? Nhập Free Fire ID của chính bạn, sau đó mở trang nạp và chọn đúng Creator ID.</p><input class="input" id="ffuid" inputmode="numeric" placeholder="Free Fire ID của bạn"><div class="row gold"><div class="grow"><b>Creator Free Fire ID: ${FF_CREATOR_ID}</b><div class="muted">Khi nạp kim cương, hãy chọn đúng ID này.</div></div><button class="small" onclick="navigator.clipboard?.writeText('${FF_CREATOR_ID}');notice='Đã copy Creator ID';render()">Copy ID</button></div><button class="dark" style="margin-top:8px" onclick="openFFDonate()">Mở trang nạp chính thức →</button><p class="muted">RBLXFinder không xử lý thanh toán và không yêu cầu mật khẩu/cookie Free Fire.</p>`)}</div>`;
if(tab==='community')body=`<h2>💬 Roblox Community</h2><div class="grid">${card('✍️ Đăng bài',`<input class="input" id="ptitle" placeholder="Tiêu đề"><textarea class="area" id="pbody" placeholder="Nội dung" style="margin-top:8px"></textarea><button class="dark" style="margin-top:8px" onclick="createPost()">Đăng</button>`)}${card('📰 Bài mới',posts.length?posts.map(p=>`<div class="row"><div class="grow"><b>${p.title||'Không tiêu đề'}</b><div class="muted">${p.body||''}</div><div class="muted">${p.author_name||'User'} · ${p.created_at?new Date(p.created_at).toLocaleString('vi-VN'):''}</div></div></div>`).join(''):'<p class="muted">Bấm tải Community để xem bài viết.</p><button class="dark" onclick="community()">Tải Community</button>')}</div>`;
if(tab==='daily')body=`<h2>🏆 Daily</h2><div class="grid">${card('🔥 Roblox Hunter',`<p class="muted">Tìm 2 game + 1 server ít người.</p><button class="dark" onclick="add(25);alert('Hoàn thành! +25 XP');render()">Hoàn thành</button>`)}${card('🎯 Aim',`<p class="muted">Đạt Score ≥ 25.</p><button class="dark" onclick="go('freefire')">Chơi ngay</button>`)}${card('🏅 Achievements',`🔎 Profile Detective · 🎮 Game Hunter · 🖥️ Server Hunter · 🎯 Aim Rookie · 🔥 Daily Streak`)}</div>`;
if(tab==='compare')body=`<h2>⚖️ Game Compare</h2><p class="muted">Chọn tối đa 4 game trong Roblox Tools.</p>${compare.length?`<div class="card" style="overflow:auto"><table class="table"><tr><th>Chỉ số</th>${compare.map(g=>`<th>${g.name}</th>`).join('')}</tr>${[['Players','playing'],['Visits','visits'],['Favorites','favorites'],['ID','id']].map(r=>`<tr><td>${r[0]}</td>${compare.map(g=>`<td>${Number(g[r[1]]||0).toLocaleString()}</td>`).join('')}</tr>`).join('')}</table></div>`:card('Chưa có game','Vào Roblox → Game Intelligence → chọn ＋.')}`;
if(tab==='about')body=`<section class="hero"><h1>RBLXFinder</h1><p>Native Android · com.noobie.rblxfinder</p></section><div class="grid">${card('Roblox','Profile Scanner · Game Intelligence · Low-Pop Server · Compare · Favorites · Donation-based Plus · Creator Center · Community · AI')}${card('Free Fire','Sensitivity Lab · Device Presets · Aim Challenge · HUD Builder · Creator Support · AI')}${card('Creator','YouTube: @noobieroblox_vn<br>Discord: nePuZm3kcu')}${card('Privacy','App không yêu cầu Roblox password/cookie. Creator authentication được xử lý bởi backend.')}</div>`;if(err)body=`<div class="error">${err}</div>`+body;if(notice)body=`<div class="ok">${notice}</div>`+body;document.querySelector('#app').innerHTML=body+'<div class="footer">Noobie · © 2026 Noobie · RBLXFinder Native Android</div>'};plusStatus().finally(render);
</script></body></html>
