else if(S.tab==='plus')v=title('⭐ Roblox Plus','Tính năng nâng cao; Roblox cơ bản vẫn miễn phí.')+`<section class="plusHero"><span class="eyebrow">RBLXFINDER PLUS</span><h1>Đi sâu hơn vào server.</h1><p>Advanced low-pop, watcher, alerts, intelligence và trends.</p></section>`+card('✨ Tính năng',`<div class="featureGrid">${['Advanced Low-pop Filters','Auto Refresh Server','Server Watcher','New-server Detection','Saved Server Alerts','Game Intelligence','Compare Games','Player Trend History','Profile Intelligence','Customization & Shortcuts'].map(x=>`<div class="feature"><span>✓</span>${x}</div>`).join('')}</div>`)+card('💎 Nhận Plus',`<p class="muted">Donate Robux cho <b>${RB_CREATOR}</b>. Creator xác nhận donation thủ công rồi cấp Plus.</p><a class="btn primary" href="https://www.roblox.com/search/users?keyword=${RB_CREATOR}" target="_blank">Mở Creator ↗</a>`);
else if(S.tab==='freefire'){const p=devices[S.device]||[180,47,440];v=title('🔥 Free Fire Lab','Sensitivity · Aim Challenge · HUD · Creator.')+card('📱 Sensitivity Lab',`<select class="select" onchange="S.device=this.value;S.sens=devices[this.value][0];S.fire=devices[this.value][1];S.dpi=devices[this.value][2];render()">${Object.keys(devices).map(d=>`<option ${d===S.device?'selected':''}>${d}</option>`).join('')}</select><div class="featureGrid" style="margin-top:9px"><div class="feature">General ${S.sens}</div><div class="feature">Red Dot ${Math.max(0,S.sens-8)}</div><div class="feature">2x ${Math.max(0,S.sens-20)}</div><div class="feature">4x ${Math.max(0,S.sens-34)}</div><div class="feature">AWM ${Math.max(0,S.sens-52)}</div><div class="feature">DPI ${S.dpi||'Auto'}</div></div><button class="btn primary" onclick="navigator.clipboard&&navigator.clipboard.writeText('FF ${S.device} | General ${S.sens} | Red Dot ${Math.max(0,S.sens-8)} | DPI ${S.dpi||'Auto'}');toast('✓ Đã copy preset')">📋 Copy preset</button>`)+card('🎯 Aim Challenge',`<div class="aim"><button class="target" onclick="shoot()">TARGET</button></div><div class="featureGrid" style="margin-top:9px"><div class="feature">Score ${S.score}</div><div class="feature">Hits ${S.hits}</div><div class="feature">Shots ${S.shots}</div></div>`)+card('🎛️ HUD Builder',`<input class="input" type="range" min="35" max="65" value="${S.fire}" oninput="S.fire=+this.value;document.getElementById('fire').style.width=(S.fire+20)+'px';document.getElementById('fire').style.height=(S.fire+20)+'px'"><div class="hud"><div id="fire" class="fire" style="width:${S.fire+20}px;height:${S.fire+20}px">FIRE</div></div>`)+card('💎 Free Fire Creator',`<p class="muted">Creator ID: <b>${FF_CREATOR}</b>. Hệ thống Creator của RBLXFinder.</p><a class="btn secondary" href="https://napthe.vn/?channel=205000" target="_blank">Donate ↗</a>`)}
else if(S.tab==='creator')v=title('👑 Creator Center','Roblox + Free Fire Creator và tích xanh RBLXFinder.')+(!S.creator?card('Đăng nhập Creator',`<p class="muted">Email Creator: <b>giakiet0903dz@gmail.com</b>. Bạn tự tạo mật khẩu.</p><input id="cpass" class="input" type="password" placeholder="Mật khẩu tự tạo"><div class="actions"><button class="btn primary" onclick="creatorAuth(false)">Đăng nhập</button><button class="btn ghost" onclick="creatorAuth(true)">Tạo tài khoản</button></div>`):card('🔵 Quản lý tích xanh',`<div class="creatorGrid"><div class="creatorBox"><h3>🎮 Roblox Creator</h3><div class="badge"><span class="check">✓</span>Creator</div><p class="muted">${RB_CREATOR}</p></div><div class="creatorBox"><h3>🔥 Free Fire Creator</h3><div class="badge"><span class="check">✓</span>Creator</div><p class="muted">${FF_CREATOR}</p></div></div><div class="search" style="margin-top:10px"><input id="cq" class="input" placeholder="Username RBLXFinder..."><button class="btn primary" onclick="creatorSearch()">Tìm</button></div><select class="select" style="margin-top:7px" onchange="S.verifyGame=this.value"><option value="both">Roblox + Free Fire</option><option value="roblox">Roblox</option><option value="freefire">Free Fire</option></select>${S.targets.map(t=>`<div class="user"><div style="flex:1"><b>${esc(t.display_name||t.username)} @${esc(t.username)}</b>${t.is_verified?'<span class="badge"><span class="check">✓</span>Tích xanh RBLXFinder</span>':''}</div><button class="btn ${t.is_verified?'ghost':'primary'}" onclick="verify('${t.user_id}',${!t.is_verified})">${t.is_verified?'Gỡ':'Cấp'} tích xanh</button></div>`).join('')}`)+card('✉️ Support & Feedback',`<p class="muted">${SUPPORT}</p><a class="btn ghost" href="mailto:${SUPPORT}?subject=RBLXFinder%20Feedback">Gửi feedback</a>`);
else if(S.tab==='community')v=title('💬 Cộng đồng','Khu Roblox và Free Fire. Nội dung dùng chung hệ sinh thái Noobie.')+`<div class="cards"><a class="game" href="${BASE}/roblox/community/" target="_blank"><img src="roblox-thumb.svg"><h2>Roblox Community</h2><p>Bài viết · like · bình luận · media</p></a><a class="game" href="${BASE}/freefire/community/" target="_blank"><img src="free-fire-thumb.svg"><h2>Free Fire Community</h2><p>Preset · sensitivity · like · bình luận</p></a></div>`;
else if(S.tab==='daily')v=title('🎯 Daily Challenges','Nhiệm vụ tăng XP và streak.')+card('Roblox Hunter',`<p class="muted">Tìm 2 game và 1 server low-pop.</p><button class="btn primary" onclick="addXp(25);S.streak++;localStorage.rblx_streak=S.streak;toast('+25 XP')">+25 XP</button>`)+card('Aim Rookie',`<p class="muted">Đạt 25 điểm Aim Challenge.</p><button class="btn primary" onclick="go('freefire')">Chơi ngay</button>`)+card('Community Player',`<p class="muted">Mở cộng đồng một game.</p><button class="btn primary" onclick="addXp(10);go('community')">+10 XP</button>`);
else if(S.tab==='compare')v=title('📊 So sánh game','Tối đa 4 game.')+(S.compare.length?`<div class="compare">${S.compare.map(g=>`<div class="compareBox"><img src="${g.thumbnailUrl||'roblox-thumb.svg'}"><b>${esc(g.name)}</b><span>👥 ${(g.playing||0).toLocaleString()}</span><span>⭐ ${(g.favorites||0).toLocaleString()}</span></div>`).join('')}</div>`:'<div class="empty">Vào Roblox → Game Search → bấm ＋ để thêm game.</div>');
document.getElementById('appview').innerHTML=v}
render();
</script></body></html>
