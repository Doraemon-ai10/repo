<script>
'use strict';
const API='https://repo-ttdo.vercel.app/api/roblox',AI='https://repo-ttdo.vercel.app/api/assistant',CREATOR_API='https://repo-ttdo.vercel.app/api/creator',SB='https://mbsnpcdmenfufhbctoek.supabase.co',KEY='sb_publishable_rwwoH9hpk6cg3woGveNObw_C00pNZsx',FF_CREATOR_ID='2035971642',FF_TOPUP='https://napthe.vn/?channel=205000',DISCORD='https://discord.gg/nePuZm3kcu',YOUTUBE='https://youtube.com/@noobieroblox_vn',SESSION='rblxfinder_auth_session';

const state={tab:'home',xp:0,streak:1,saved:[],games:[],servers:[],compare:[],user:null,posts:[],postKind:'rb',plusUserId:0,plus:false,creator:false,creatorPassword:'',notice:'',error:'',score:0,hits:0,shots:0,device:'OPPO A9 2020',general:180,fire:47,dpi:440};
try{state.xp=+localStorage.rblx_xp||0;state.streak=+localStorage.rblx_streak||1;state.saved=JSON.parse(localStorage.rblx_saved_games||'[]');state.plusUserId=+localStorage.plusUserId||0}catch(e){}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function visitor(){let x=localStorage.rblx_visitor_id;if(!x){x=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());localStorage.rblx_visitor_id=x}return x}
function toast(m,err=false){state.notice=err?'':m;state.error=err?m:'';render();setTimeout(()=>{state.notice='';state.error='';render()},2600)}
function addXp(n){state.xp+=n;localStorage.rblx_xp=state.xp;cloudPush(false)}
function go(x){state.tab=x;state.notice='';state.error='';render();window.scrollTo(0,0)}
function nav(){const items=[['home','Trang chủ'],['roblox','Roblox'],['plus','⭐ Plus'],['creator','👑 Creator'],['freefire','Free Fire'],['community','Cộng đồng'],['daily','Daily'],['compare','So sánh'],['about','Giới thiệu']];document.querySelector('#tabs').innerHTML=items.map(x=>`<button class="${state.tab===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');const bot=[['home','⌂'],['roblox','Roblox'],['freefire','FF'],['community','Cộng đồng'],['about','☰']];document.querySelector('#bottom').innerHTML=bot.map(x=>`<button class="${state.tab===x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}
function withTimeout(p,ms=12000){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))])}
async function req(url,body){const r=await withTimeout(fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}));const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||d.message||'API error');return d}
async function rb(body){return req(API,body)}
async function findUser(){const el=document.querySelector('#username');const v=el?.value.trim();if(!v)return toast('Nhập username Roblox',true);try{state.user=await rb({action:'username',username:v});addXp(10);toast('Đã tìm thấy username')}catch(e){toast('Không tìm thấy username hoặc mạng đang bận',true)}render()}
async function avatar(id){try{const d=await rb({action:'avatar',userId:id});return d?.data?.[0]?.imageUrl||''}catch{return''}}
async function findGames(){const v=document.querySelector('#gameq')?.value.trim();if(!v)return toast('Nhập tên game',true);try{state.games=(await rb({action:'games',q:v})).games||[];addXp(15)}catch{toast('Không tải được game',true)}render()}
async function findServers(){const v=Number(document.querySelector('#serverq')?.value);if(!v)return toast('Nhập Universe ID',true);try{state.servers=(await rb({action:'servers',universeId:v})).data||[];addXp(10)}catch{toast('Không tải được server',true)}render()}
async function gameDetails(id){try{const d=await rb({action:'details',universeId:id});const g=d?.data?.[0];if(!g)return;alert(`${g.name}\n\n${g.description||'Không có mô tả'}\n\nPlayers: ${(g.playing||0).toLocaleString()}\nVisits: ${(g.visits||0).toLocaleString()}`)}catch{toast('Không tải được chi tiết game',true)}}
function saveGame(id){const x=String(id);state.saved=state.saved.includes(x)?state.saved.filter(v=>v!==x):[...state.saved,x];localStorage.rblx_saved_games=JSON.stringify(state.saved);addXp(3);render()}
function cmp(id){const g=state.games.find(x=>x.id==id);if(!g)return;state.compare=state.compare.some(x=>x.id==id)?state.compare.filter(x=>x.id!=id):state.compare.length<4?[...state.compare,g]:state.compare;cloudPush(false);render()}
async function plusStatus(){if(!state.plusUserId)return;try{const d=await req(CREATOR_API,{action:'status',userId:state.plusUserId});state.plus=!!(d.plus||d.active)}catch{state.plus=false}}
async function resolvePlus(){const v=document.querySelector('#plususername')?.value.trim();if(!v)return toast('Nhập username Roblox',true);try{const d=await req(CREATOR_API,{action:'resolve',username:v});state.plusUserId=Number(d.user.id);localStorage.plusUserId=state.plusUserId;await plusStatus();toast('Đã liên kết User ID')}catch{toast('Không tìm thấy username',true)}render()}
async function creatorLogin(){const u=document.querySelector('#creatoruser')?.value.trim(),p=document.querySelector('#creatorpass')?.value;if(!u||!p)return toast('Nhập đủ thông tin Creator',true);try{const d=await req(CREATOR_API,{action:'creator-login',username:u,password:p});if(!d.ok&&!d.authenticated&&!d.success)throw Error();state.creator=true;state.creatorPassword=p;toast('Creator đăng nhập thành công')}catch{toast('Sai thông tin Creator',true)}render()}
async function recordDonation(){if(!state.creator)return;const u=document.querySelector('#donateuser')?.value.trim(),id=Number(document.querySelector('#donateid')?.value),a=Number(document.querySelector('#donateamount')?.value);if(!u||!id||a<=0)return toast('Điền username, User ID và Robux',true);try{await req(CREATOR_API,{action:'record-donation',username:u,password:state.creatorPassword,userId:id,robloxUsername:u,amount:a,note:document.querySelector('#donatenote')?.value.trim()});toast('Đã ghi nhận donation')}catch(e){toast('Không ghi nhận donation: '+e.message,true)}render()}
async function grantPlus(){if(!state.creator)return;const u=document.querySelector('#grantuser')?.value.trim();if(!u)return toast('Nhập username cần cấp Plus',true);try{await req(CREATOR_API,{action:'grant',username:u,password:state.creatorPassword,note:document.querySelector('#grantnote')?.value.trim()});toast('Đã cấp Plus')}catch(e){toast('Không cấp Plus: '+e.message,true)}render()}
async function leaderboard(){try{const r=await withTimeout(fetch(CREATOR_API+'?action=leaderboard'));const d=await r.json();return d.leaderboard||d.data||[]}catch{return[]}}
async function loadPosts(kind){state.postKind=kind;const table=kind==='ff'?'ff_posts':'rb_posts';try{const r=await withTimeout(fetch(SB+'/rest/v1/'+table+'?select=*&order=created_at.desc&limit=50',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}));state.posts=r.ok?await r.json():[]}catch{state.posts=[]}render()}
async function createPost(kind){const body=document.querySelector('#pbody')?.value.trim();if(!body)return toast('Nhập nội dung',true);const table=kind==='ff'?'ff_posts':'rb_posts';const payload=kind==='ff'?{display_name:'RBLXFinder',body,category:'Preset',device:state.device,general:state.general,fire_button:state.fire,dpi:state.dpi}:{display_name:'RBLXFinder',title:document.querySelector('#ptitle')?.value.trim()||'Thảo luận',body,category:'Thảo luận'};try{const r=await withTimeout(fetch(SB+'/rest/v1/'+table,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)}));if(!r.ok)throw Error();toast('Đã đăng bài');loadPosts(kind)}catch{toast('Không đăng được bài',true)}}
async function likePost(kind,id){const rpc=kind==='ff'?'toggle_ff_like':'toggle_rb_like';try{await withTimeout(fetch(SB+'/rest/v1/rpc/'+rpc,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_post_id:id,p_visitor_id:visitor()})}));toast('Đã cập nhật lượt thích')}catch{toast('Không thể thích bài',true)}}
async function commentPost(kind,id){const v=document.querySelector('#comment-'+id)?.value.trim();if(!v)return;const table=kind==='ff'?'ff_comments':'rb_comments';try{const r=await withTimeout(fetch(SB+'/rest/v1/'+table,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({post_id:id,display_name:'Người chơi',body:v,moderation_status:'approved'})}));if(!r.ok)throw Error();toast('Đã gửi bình luận')}catch{toast('Bình luận không gửi được',true)}}
function setDevice(v){state.device=v;const p=devices[v]||devices['OPPO A9 2020'];state.general=p[0];state.dpi=p[1];state.fire=p[2];cloudPush(false);render()}
function shoot(){state.shots++;if(Math.random()>.25){state.hits++;state.score=Math.min(100,state.score+4);addXp(2)}else state.score=Math.max(0,state.score-1);render()}
async function askAI(){const q=prompt('Bạn muốn hỏi AI điều gì?');if(!q)return;try{const d=await req(AI,{message:q,game:state.tab==='freefire'?'freefire':'roblox'});alert(d.answer||d.reply||'AI chưa trả lời')}catch{alert('AI hiện không kết nối được')}}
function ffDonate(){const id=document.querySelector('#ffuid')?.value.trim();if(!/^\d{6,15}$/.test(id))return toast('Nhập Free Fire ID của bạn',true);location.href=FF_TOPUP}
function theme(t){localStorage.rblx_theme=t;document.body.dataset.theme=t;document.body.style.background=t==='light'?'#f4f8fc':t==='blue'?'#041a35':t==='purple'?'#160a2d':'#050b16'}
function setLang(l){localStorage.rblxfinder_lang=l;location.reload()}
function openSettings(){document.querySelector('#settings').classList.remove('hidden')};function closeSettings(){document.querySelector('#settings').classList.add('hidden')}
function openAccount(){document.querySelector('#account').classList.remove('hidden');renderAccount()};function closeAccount(){document.querySelector('#account').classList.add('hidden')}
function getSession(){try{return JSON.parse(localStorage.getItem(SESSION)||'null')}catch{return null}}
function collect(){const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||k===SESSION||k.startsWith('rblxfinder_auth_'))continue;const raw=localStorage.getItem(k);try{d[k]=JSON.parse(raw||'null')}catch{d[k]=raw}}return d}
function restore(d){if(!d)return;Object.entries(d).forEach(([k,v])=>{try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v))}catch{}})}
async function cloudPush(show=true){const s=getSession();if(!s?.access_token||!s?.user?.id)return false;try{const r=await withTimeout(fetch(SB+'/rest/v1/rblxfinder_user_data?on_conflict=user_id',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:s.user.id,data:collect(),updated_at:new Date().toISOString()})}));if(show)toast(r.ok?'☁️ Đã đồng bộ':'⚠️ Đồng bộ thất bại',!r.ok);return r.ok}catch{if(show)toast('⚠️ Cloud timeout',true);return false}}
async function cloudPull(s){if(!s?.access_token||!s?.user?.id)return false;try{const r=await withTimeout(fetch(SB+'/rest/v1/rblxfinder_user_data?select=data&user_id=eq.'+encodeURIComponent(s.user.id),{headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}}));if(!r.ok)return false;const a=await r.json();if(a[0]?.data)restore(a[0].data);return true}catch{return false}}
async function auth(type){const email=document.querySelector('#aEmail')?.value.trim(),password=document.querySelector('#aPass')?.value;if(!email||!password)return setAccountMsg('Nhập email và mật khẩu');setAccountMsg('Đang xử lý...');try{const r=await withTimeout(fetch(SB+'/auth/v1/'+(type==='login'?'token?grant_type=password':'signup'),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error_description||d.msg||'Không thành công');if(!d.access_token)return setAccountMsg('Tài khoản đã tạo. Nếu cần, hãy xác nhận email rồi đăng nhập.');localStorage.setItem(SESSION,JSON.stringify(d));await cloudPull(d);await cloudPush(false);setAccountMsg('☁️ Đăng nhập + đồng bộ thành công');setTimeout(()=>location.reload(),500)}catch(e){setAccountMsg(e.message||'Không thể đăng nhập')}}
async function renderAccount(){const s=getSession(),el=document.querySelector('#accountBody');if(!el)return;if(!s?.user){el.innerHTML='<input id="aEmail" class="input" type="email" placeholder="Email" style="margin-top:16px"><input id="aPass" class="input" type="password" placeholder="Mật khẩu" style="margin-top:9px"><div class="form" style="margin-top:10px"><button class="btn" onclick="auth(\'login\')">Đăng nhập</button><button class="btn secondary" onclick="auth(\'signup\')">Đăng ký</button></div><p id="aMsg" class="muted"></p>';return}el.innerHTML=`<div class="notice" style="margin-top:15px">☁️ ${esc(s.user.email||'Tài khoản')}<br><span class="muted">Web và APK dùng chung dữ liệu tài khoản này.</span></div><div class="form"><button class="btn" onclick="cloudPush(true)">☁️ Đồng bộ</button><button class="btn secondary" onclick="cloudPull(getSession()).then(()=>location.reload())">↙ Tải cloud</button><button class="btn red" onclick="localStorage.removeItem('${SESSION}');location.reload()">Đăng xuất</button></div>`}
function setAccountMsg(x){const e=document.querySelector('#aMsg');if(e)e.textContent=x}
function render(){nav();let b='';if(state.tab==='home')b=`<section class="hero"><div class="heroLogo"><img src="rblxfinder-icon.webp"><div><div class="badge">NATIVE APP · NOOBIE</div><h1>RBLXFinder<br>NOOBIE GAMING HUB</h1></div></div><p>Tất cả công cụ Roblox + Free Fire trong một app. Giao diện chạy local trong APK, dữ liệu tài khoản đồng bộ Supabase.</p><div class="grid"><button class="btn" onclick="go('roblox')">🔎 Roblox Tools</button><button class="btn" onclick="go('freefire')">🎯 Free Fire</button><button class="btn purple" onclick="go('plus')">⭐ Plus</button><button class="btn secondary" onclick="askAI()">🤖 AI Assistant</button></div></section><div class="grid">${card('🏆 Level & XP',`<b style="font-size:30px">${Math.floor(state.xp/100)+1}</b><p class="muted">${state.xp%100}/100 XP · 🔥 ${state.streak} ngày</p>`)}${card('⭐ Saved Games',`<b style="font-size:30px">${state.saved.length}</b><p class="muted">Được cloud-sync khi đăng nhập.</p>`)}${card('☁️ Cloud',getSession()?'<b>Đã đăng nhập</b><p class="muted">Dữ liệu sẽ đồng bộ tự động.</p>':'<b>Chưa đăng nhập</b><p class="muted">Bấm nút tài khoản để bật cloud sync.</p>')}</div><div class="grid">${card('🌐 Roblox',`Username · Avatar · Game Search · Thumbnails · Details · Public Server · Low-Pop · Private Server check · Favorites · Compare · Plus`)}${card('🎯 Free Fire',`Sensitivity Lab · Presets · Fire Button · DPI · Aim Challenge · HUD · Community · Creator Donate`)}${card('👥 Community',`Roblox + Free Fire posts, likes, comments và dữ liệu Supabase.`)}${card('🔗 Creator',`<button class="btn secondary" onclick="location.href='${DISCORD}'">Discord</button> <button class="btn secondary" onclick="location.href='${YOUTUBE}'">YouTube</button>`)}</div>`;
if(state.tab==='roblox')b=`<h2>🎮 Roblox Power Tools</h2><div class="grid">${card('👤 Profile Scanner',`<div class="form"><input id="username" class="input" placeholder="Username Roblox"><button class="btn" onclick="findUser()">Tìm</button></div>${state.user?`<div class="row"><div class="avatar">${esc((state.user.displayName||state.user.name||'U')[0])}</div><div class="grow"><b>${esc(state.user.displayName||state.user.name)}</b><div class="muted">@${esc(state.user.name||'')} · User ID: ${state.user.id}</div></div><button class="small" onclick="state.plusUserId=${state.user.id};localStorage.plusUserId=${state.user.id};go('plus')">⭐</button></div>`:''}`)}${card('🎮 Game Intelligence',`<div class="form"><input id="gameq" class="input" placeholder="Tên game Roblox"><button class="btn" onclick="findGames()">Tìm</button></div><div class="list">${state.games.slice(0,20).map(g=>`<div class="row"><div class="grow"><b>${esc(g.name)}</b><div class="muted">👥 ${(g.playing||0).toLocaleString()} · ⭐ ${(g.favorites||0).toLocaleString()} · Visits ${(g.visits||0).toLocaleString()}</div></div><button class="small" onclick="gameDetails(${g.universeId||g.id})">Info</button><button class="small" onclick="cmp(${g.universeId||g.id})">${state.compare.some(x=>(x.universeId||x.id)==(g.universeId||g.id))?'✓':'＋'}</button><button class="small" onclick="saveGame(${g.universeId||g.id})">${state.saved.includes(String(g.universeId||g.id))?'★':'☆'}</button></div>`).join('')}</div>`)}${card('🖥️ Low-Pop Server Finder',`<div class="form"><input id="serverq" class="input" inputmode="numeric" placeholder="Universe ID"><button class="btn" onclick="findServers()">Tìm</button></div><div class="list">${state.servers.slice().sort((a,b)=>(a.playing||999)-(b.playing||999)).slice(0,40).map(s=>`<div class="row"><b>${s.playing||0}/${s.maxPlayers||'?'}</b><span class="grow muted">${esc(s.id||'')}</span><button class="small" onclick="navigator.clipboard?.writeText('${esc(s.id||'')}');toast('Đã copy Server ID')">Copy</button></div>`).join('')}</div>`)}${card('🔒 Private Server',`<p class="muted">Kiểm tra game có bật Private Server hay không. Tạo server thật vẫn cần Roblox account/flow của Roblox.</p><input id="privateq" class="input" inputmode="numeric" placeholder="Universe ID"><button class="btn secondary" style="margin-top:8px" onclick="(async()=>{try{const d=await rb({action:'private',universeId:Number(document.querySelector('#privateq').value)});alert(JSON.stringify(d))}catch{toast('Không kiểm tra được',true)}})()">Kiểm tra</button>`)}</div>`;
if(state.tab==='plus')b=`<h2>⭐ RBLXFinder Plus</h2><p class="muted">Donate Robux cho Creator <b>khoungbell7777</b> trước. Creator xác nhận donation rồi mới cấp Plus.</p><div class="grid">${card('👤 Liên kết Roblox',`<input id="plususername" class="input" placeholder="Username Roblox"><button class="btn" style="margin-top:8px" onclick="resolvePlus()">Kiểm tra</button><p class="muted">User ID: ${state.plusUserId||'chưa có'}</p>`)}${card('⭐ Trạng thái',`<b>${state.plus?'PLUS ACTIVE':'FREE'}</b><p class="muted">${state.plus?'Đã được Creator cấp Plus.':'Core features vẫn miễn phí.'}</p>`)}</div><div class="grid">${card('💎 Plus',`<div class="chips"><span class="chip">Advanced Low-Pop</span><span class="chip">Auto Refresh</span><span class="chip">Server Watcher</span><span class="chip">Saved Alerts</span><span class="chip">Game Intelligence</span><span class="chip">Compare</span><span class="chip">Player Trends</span><span class="chip">Advanced Profile</span></div>`)}${card('🏆 Donate Leaderboard',`<button class="btn secondary" onclick="leaderboard().then(a=>{document.querySelector('#leader').innerHTML=a.slice(0,50).map((x,i)=>'<div class=\"row\"><span class=\"rank\">'+(i+1)+'</span><div class=\"grow\"><b>'+esc(x.roblox_username||'User')+'</b></div><b>'+Number(x.total_robux||0).toLocaleString()+' R$</b></div>').join('')||'<p class=\"muted\">Chưa có donation.</p>'})">Tải bảng xếp hạng</button><div id="leader" class="list"></div>`)}</div>`;
if(state.tab==='creator')b=`<h2>👑 Creator Dashboard</h2>${state.creator?`<div class="notice">Creator session đang hoạt động.</div><div class="grid">${card('💰 Ghi nhận donation',`<input id="donateuser" class="input" placeholder="Roblox username"><input id="donateid" class="input" style="margin-top:7px" placeholder="User ID" inputmode="numeric"><input id="donateamount" class="input" style="margin-top:7px" placeholder="Robux đã nhận" inputmode="numeric"><input id="donatenote" class="input" style="margin-top:7px" placeholder="Ghi chú"><button class="btn green" style="margin-top:8px" onclick="recordDonation()">Ghi nhận</button>`)}${card('⭐ Cấp Plus',`<input id="grantuser" class="input" placeholder="Username Roblox"><input id="grantnote" class="input" style="margin-top:7px" placeholder="Ghi chú"><button class="btn purple" style="margin-top:8px" onclick="grantPlus()">Cấp Plus</button>`)}</div>`:`<div class="card"><input id="creatoruser" class="input" value="khoungbell7777" placeholder="Creator username"><input id="creatorpass" class="input" style="margin-top:7px" type="password" placeholder="Creator password"><button class="btn purple" style="margin-top:8px" onclick="creatorLogin()">Đăng nhập Creator</button><p class="muted">Mật khẩu không lưu vào localStorage.</p></div>`}`;
if(state.tab==='freefire')b=`<h2>🎯 Free Fire Hub</h2><div class="grid">${card('📱 Sensitivity Lab',`<select class="input" onchange="setDevice(this.value)">${Object.keys(devices).map(x=>`<option ${x===state.device?'selected':''}>${x}</option>`).join('')}</select><div class="stats"><div class="stat"><b>${state.general}</b>General</div><div class="stat"><b>${Math.max(0,state.general-8)}</b>Red Dot</div><div class="stat"><b>${state.dpi||'Auto'}</b>DPI</div></div><label class="muted">General</label><input class="range" type="range" min="100" max="200" value="${state.general}" oninput="state.general=+this.value;render()"><label class="muted">Fire Button</label><input class="range" type="range" min="35" max="65" value="${state.fire}" oninput="state.fire=+this.value;render()"><label class="muted">DPI</label><input class="range" type="range" min="0" max="1000" value="${state.dpi}" oninput="state.dpi=+this.value;render()"><button class="btn" style="margin-top:8px" onclick="navigator.clipboard?.writeText('Free Fire ${state.device} | General ${state.general} | Red Dot ${Math.max(0,state.general-8)} | 2x ${Math.max(0,state.general-20)} | 4x ${Math.max(0,state.general-34)} | AWM ${Math.max(0,state.general-52)} | Fire ${state.fire} | DPI ${state.dpi||'Auto'}');toast('Đã copy preset')">Copy preset</button>`)}${card('🎯 Aim Challenge',`<div class="target"><button onclick="shoot()">🎯</button></div><div class="stats"><div class="stat"><b>${state.score}</b>Score</div><div class="stat"><b>${state.hits}</b>Hits</div><div class="stat"><b>${state.shots}</b>Shots</div></div>`)}${card('🎛️ HUD Builder',`<p class="muted">Fire Button: ${state.fire}%</p><div style="height:120px;background:#06101f;border-radius:15px;display:grid;place-items:center"><div style="width:${state.fire+20}px;height:${state.fire+20}px;border-radius:50%;background:#ef4268;display:grid;place-items:center;font-weight:900">FIRE</div></div>`)}${card('💎 Donate Creator',`<p class="muted">Nhập FF ID của bạn rồi donate/nạp diamonds cho Creator FF ID <b>${FF_CREATOR_ID}</b>.</p><input id="ffuid" class="input" placeholder="Free Fire ID của bạn" inputmode="numeric"><button class="btn green" style="margin-top:8px" onclick="ffDonate()">Mở Garena Top-up</button>`)}</div>`;
if(state.tab==='community')b=`<h2>👥 Community</h2><div class="card"><h3>Đăng bài</h3><input id="ptitle" class="input" placeholder="Tiêu đề"><textarea id="pbody" class="area" style="margin-top:8px" placeholder="Chia sẻ với cộng đồng..."></textarea><div class="form" style="margin-top:8px"><button class="btn" onclick="createPost('rb')">Đăng Roblox</button><button class="btn" onclick="createPost('ff')">Đăng Free Fire</button></div></div><div class="card" style="margin-top:12px"><div class="form"><button class="btn secondary" onclick="loadPosts('rb')">Roblox</button><button class="btn secondary" onclick="loadPosts('ff')">Free Fire</button></div></div><div class="list" style="margin-top:12px">${state.posts.map(p=>`<article class="card post"><div class="avatar">${esc((p.display_name||'N')[0])}</div><div class="postbody"><h3>${esc(p.title||p.body?.slice(0,70)||'Bài viết')}</h3><div class="muted">${esc(p.display_name||'Người chơi')} · ${p.created_at?new Date(p.created_at).toLocaleString('vi-VN'):''}</div><p>${esc(p.body||'')}</p>${p.device?`<div class="chips"><span class="chip">${esc(p.device)}</span><span class="chip">General ${p.general}</span><span class="chip">Fire ${p.fire_button}</span><span class="chip">DPI ${p.dpi||'Auto'}</span></div>`:''}<div class="commentbox"><input id="comment-${p.id}" class="input" placeholder="Bình luận"><button class="small" onclick="likePost('${state.postKind}','${p.id}')">♥</button><button class="small" onclick="commentPost('${state.postKind}','${p.id}')">Gửi</button></div></div></article>`).join('')||'<p class="muted">Chưa có bài. Chọn Roblox/Free Fire để tải.</p>'}</div>`;
if(state.tab==='daily')b=`<h2>🏆 Daily & Achievements</h2><div class="grid">${card('🎁 Daily Reward',`<b>+25 XP</b><p class="muted">Nhận thưởng mỗi ngày.</p><button class="btn" onclick="addXp(25);state.streak++;localStorage.rblx_streak=state.streak;toast('Đã nhận +25 XP')">Nhận thưởng</button>`)}${card('🔥 Daily Quest',`<p>Tìm 2 game Roblox + 1 server ít người.</p><button class="btn" onclick="addXp(25);toast('Quest hoàn thành +25 XP')">Hoàn thành</button>`)}${card('🏅 Achievements',`<div class="chips"><span class="chip">Profile Detective</span><span class="chip">Game Hunter</span><span class="chip">Server Hunter</span><span class="chip">Aim Rookie</span><span class="chip">Daily Streak</span></div>`)}</div>`;
if(state.tab==='compare')b=`<h2>⚖️ Game Compare</h2><p class="muted">Tối đa 4 game.</p>${state.compare.length?`<div class="card" style="overflow:auto"><table class="table"><thead><tr><th>Chỉ số</th>${state.compare.map(g=>`<th>${esc(g.name)}</th>`).join('')}</tr></thead><tbody>${[['Players','playing'],['Visits','visits'],['Favorites','favorites'],['ID','universeId']].map(r=>`<tr><th>${r[0]}</th>${state.compare.map(g=>`<td>${Number(g[r[1]]||0).toLocaleString()}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:card('Chưa có game','Vào Roblox → Game Intelligence → bấm ＋ để thêm.')}`;
if(state.tab==='about')b=`<h2>ℹ️ RBLXFinder</h2><div class="grid">${card('⚡ Noobie Gaming Hub','Roblox + Free Fire utility hub. Native Android UI chạy local trong APK.')}${card('☁️ Cloud Sync','Đăng nhập tài khoản RBLXFinder để đồng bộ XP, saved games, compare, settings và dữ liệu local giữa web/APK.')}${card('🛡️ Privacy','Không cần mật khẩu Roblox hoặc cookie Roblox để tra cứu username/game/server.')}${card('📱 App','Application ID: com.noobie.rblxfinder · v3.0.0')}</div><div class="card" style="margin-top:13px"><button class="btn secondary" onclick="openAccount()">☁️ Tài khoản & Cloud</button> <button class="btn secondary" onclick="askAI()">🤖 AI</button></div><div class="footer">Noobie · RBLXFinder · © 2026 Noobie. All rights reserved.</div>`;
document.querySelector('#app').innerHTML=(state.error?`<div class="error">${esc(state.error)}</div>`:'')+(state.notice?`<div class="notice">${esc(state.notice)}</div>`:'')+b}
try{theme(localStorage.rblx_theme||'dark')}catch(e){}
render();
setTimeout(()=>{if(getSession())cloudPull(getSession()).then(()=>{render()})},500);
setInterval(()=>{if(getSession())cloudPush(false)},15000);
</script></body></html>
