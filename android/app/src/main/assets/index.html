<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f8fafc"><title>RBLXFinder — Noobie</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fbff,#fff);color:#111827;font-family:Inter,system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.top{position:sticky;top:0;z-index:5;background:#ffffffeF;border-bottom:1px solid #e5e7eb;padding:12px 14px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:21px}.badge{font-size:10px;padding:5px 8px;border-radius:99px;background:#eff6ff;color:#2563eb}.tabs{display:flex;gap:7px;overflow:auto;margin-top:11px;padding-bottom:2px}.tabs button{white-space:nowrap;padding:9px 12px;border-radius:11px;background:#f1f5f9;color:#334155;font-weight:800}.tabs button.on{background:#111827;color:white}.wrap{max-width:900px;margin:auto;padding:18px 14px 60px}.hero{padding:24px 19px;border-radius:24px;background:linear-gradient(135deg,#111827,#2563eb);color:white;box-shadow:0 16px 45px #1e3a8a22}.hero h1{font-size:34px;line-height:1.05;margin:8px 0}.hero p{line-height:1.55;opacity:.86}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.light,.dark{padding:11px 14px;border-radius:11px;font-weight:900}.primary{background:white;color:#111827}.light{background:#ffffff1c;color:white;border:1px solid #ffffff44}.dark{background:#111827;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px;margin-top:15px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:15px;box-shadow:0 7px 25px #0f172a08}.card h3{margin:0 0 11px}.muted{color:#64748b;font-size:13px;line-height:1.5}.row{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #e8edf3;border-radius:13px;margin-top:8px}.row .grow{flex:1}.input{width:100%;padding:11px 12px;border:1px solid #dbe1e8;border-radius:11px;background:white;outline:none}.form{display:flex;gap:7px}.form .input{flex:1}.small{padding:8px 9px;border-radius:9px;background:#f1f5f9;color:#334155;font-weight:800;font-size:12px}.stat{padding:12px;border-radius:13px;background:#f8fafc;text-align:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.error{padding:11px;border-radius:12px;background:#fef2f2;color:#b91c1c;font-weight:700;margin-bottom:12px}.target{height:210px;border-radius:18px;background:radial-gradient(circle,#dbeafe,#f8fafc);display:grid;place-items:center}.target button{width:72px;height:72px;border-radius:50%;border:8px solid #ef4444;background:white;font-size:24px}.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:35px}.pill{display:inline-block;padding:5px 8px;background:#eef2ff;color:#4338ca;border-radius:99px;font-size:11px;font-weight:800}
</style></head><body><header class="top"><div class="brand">⚡ RBLXFinder <span class="badge">NOOBIE GAMING HUB</span></div><nav class="tabs" id="tabs"></nav></header><main class="wrap" id="app"></main><script>
const API='https://repo-ttdo.vercel.app/api/roblox', AI='https://repo-ttdo.vercel.app/api/assistant';let tab='home',xp=+localStorage.xp||0,streak=+localStorage.streak||1,saved=JSON.parse(localStorage.saved||'[]'),games=[],servers=[],compare=[],user=null,err='';
const tabs=[['home','Home'],['roblox','Roblox'],['freefire','Free Fire'],['daily','Daily'],['compare','Compare'],['about','About']];
function nav(){document.querySelector('#tabs').innerHTML=tabs.map(x=>`<button class="${tab==x[0]?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}
function go(x){tab=x;err='';render()}function add(n){xp+=n;localStorage.xp=xp}
async function post(body){let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||'API error');return d}
async function findUser(){let v=document.querySelector('#username').value.trim();if(!v)return;busy(true);try{user=await post({action:'username',username:v});add(10)}catch(e){err='Không tìm thấy username Roblox.'}finally{busy(false)}}
async function findGames(){let v=document.querySelector('#gameq').value.trim();if(!v)return;busy(true);try{let d=await post({action:'games',q:v});games=d.games||d.data||[];add(15)}catch(e){err='Không tải được game.'}finally{busy(false)}}
async function findServers(){let v=+document.querySelector('#serverq').value;if(!v)return;busy(true);try{let d=await post({action:'servers',universeId:v});servers=d.data||[];add(10)}catch(e){err='Không tải được server.'}finally{busy(false)}}
function busy(v){let b=document.querySelectorAll('button');b.forEach(x=>{if(x.textContent.includes('Tìm'))x.disabled=v});if(v){document.querySelector('#app').style.opacity='.65'}else render()}
function save(id){saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];localStorage.saved=JSON.stringify(saved);add(3);render()}
function cmp(id){let g=games.find(x=>x.id==id);if(!g)return;compare=compare.some(x=>x.id==id)?compare.filter(x=>x.id!=id):compare.length<4?[...compare,g]:compare;render()}
function shoot(){let hit=Math.random()>.25;let s=+localStorage.shots||0,h=+localStorage.hits||0,sc=+localStorage.score||0;localStorage.shots=s+1;if(hit){localStorage.hits=h+1;localStorage.score=Math.min(100,sc+4);add(2)}else localStorage.score=Math.max(0,sc-1);render()}
function card(t,b){return `<section class="card"><h3>${t}</h3>${b}</section>`}
function render(){nav();let body='';if(tab==='home')body=`<section class="hero"><span class="pill">NATIVE ANDROID APP</span><h1>Roblox + Free Fire<br>trong một app.</h1><p>RBLXFinder by Noobie — công cụ tìm username, game, server ít người, Compare, Free Fire Lab, XP và Daily.</p><div class="actions"><button class="primary" onclick="go('roblox')">🔎 Roblox Tools</button><button class="light" onclick="go('freefire')">🎯 Free Fire Lab</button></div></section><div class="grid">${card('🏆 Level & XP',`<b style="font-size:30px">${Math.floor(xp/100)+1}</b><p class="muted">${xp%100}/100 XP · 🔥 ${streak} ngày</p>`)}${card('⭐ Saved Games',`<b style="font-size:30px">${saved.length}</b><p class="muted">Lưu ngay trên thiết bị</p>`)}${card('🤖 AI Assistant',`<b>Roblox + Free Fire</b><p class="muted">Hỏi trợ lý AI trong app.</p><button class="dark" onclick="askAI()">Mở AI</button>`)}</div>`;
if(tab==='roblox')body=`<h2>🎮 Roblox Power Tools</h2><div class="grid">${card('👤 Profile Scanner',`<div class="form"><input class="input" id="username" placeholder="Username Roblox"><button class="dark" onclick="findUser()">Tìm</button></div>${user?`<div class="row"><div class="grow"><b>${user.displayName}</b> <span class="muted">@${user.name}</span><div class="muted">User ID: ${user.id}</div></div></div>`:''}`)}${card('🎮 Game Intelligence',`<div class="form"><input class="input" id="gameq" placeholder="Tên game"><button class="dark" onclick="findGames()">Tìm</button></div><div>${games.slice(0,12).map(g=>`<div class="row"><div class="grow"><b>${g.name}</b><div class="muted">👥 ${(g.playing||0).toLocaleString()} · ⭐ ${(g.favorites||0).toLocaleString()}</div></div><button class="small" onclick="cmp(${g.id})">${compare.some(x=>x.id==g.id)?'✓':'＋'}</button><button class="small" onclick="save('${g.id}')">${saved.includes(String(g.id))?'★':'☆'}</button></div>`).join('')}</div>`)}${card('🖥️ Low-Pop Server Finder',`<p class="muted">Nhập Universe ID để tìm public server và sắp xếp server ít người trước.</p><div class="form"><input class="input" id="serverq" inputmode="numeric" placeholder="Universe ID"><button class="dark" onclick="findServers()">Tìm</button></div>${servers.slice().sort((a,b)=>(a.playing||999)-(b.playing||999)).slice(0,20).map(s=>`<div class="row"><b>${s.playing||0}/${s.maxPlayers||'?'}</b><span class="grow muted">${s.id||''}</span><button class="small" onclick="navigator.clipboard?.writeText('${s.id||''}')">Copy</button></div>`).join('')}`)}</div>`;
if(tab==='freefire')body=`<h2>🎯 Free Fire Lab</h2><div class="grid">${card('📱 Sensitivity Presets',`<select class="input" id="preset"><option>OPPO A9 2020</option><option>iPhone 11</option><option>iPhone 13</option><option>iPhone 15 Pro</option><option>Samsung A54</option><option>Samsung S24</option><option>Redmi Note 13</option><option>vivo V40</option><option>realme 12</option></select><div class="stats"><div class="stat"><b>General</b><br>194</div><div class="stat"><b>Red Dot</b><br>49</div><div class="stat"><b>DPI</b><br>Auto</div></div><button class="dark" onclick="navigator.clipboard?.writeText('Free Fire sensitivity preset');add(5);render()">📋 Copy preset</button>`)}${card('🎯 Aim Challenge',`<p class="muted">Luyện phản xạ. Hit +4 điểm.</p><div class="target"><button onclick="shoot()">🎯</button></div><div class="stats"><div class="stat"><b>Score</b><br>${+localStorage.score||0}</div><div class="stat"><b>Hits</b><br>${+localStorage.hits||0}</div><div class="stat"><b>Shots</b><br>${+localStorage.shots||0}</div></div>`)}${card('🎛️ HUD Builder',`<p class="muted">Điều chỉnh kích thước nút bắn.</p><input style="width:100%" type="range" min="35" max="65" value="50" oninput="document.querySelector('#fire').style.width=this.value+'px';document.querySelector('#fire').style.height=this.value+'px'"><div style="height:110px;background:#0f172a;border-radius:15px;display:grid;place-items:center"><div id="fire" style="width:50px;height:50px;border-radius:50%;background:#ef4444;color:white;display:grid;place-items:center;font-weight:900">FIRE</div></div>`)}${card('💎 Creator Support',`<p class="muted">Ủng hộ Noobie qua kênh donate tương ứng của game.</p><button class="dark" onclick="location.href='https://napthe.vn/?channel=205000'">Free Fire Donate</button>`)} </div>`;
if(tab==='daily')body=`<h2>🏆 Daily</h2><div class="grid">${card('🔥 Roblox Hunter',`<p class="muted">Tìm 2 game + 1 server ít người.</p><button class="dark" onclick="add(25);alert('Hoàn thành! +25 XP');render()">Hoàn thành</button>`)}${card('🎯 Aim',`<p class="muted">Đạt Score ≥ 25.</p><button class="dark" onclick="go('freefire')">Chơi ngay</button>`)}${card('🏅 Achievements',`🔎 Profile Detective · 🎮 Game Hunter · 🖥️ Server Hunter · 🎯 Aim Rookie · 🔥 Daily Streak`)}</div>`;
if(tab==='compare')body=`<h2>⚖️ Game Compare</h2><p class="muted">Chọn tối đa 4 game trong Roblox Tools.</p>${compare.length?`<div class="card" style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th>Chỉ số</th>${compare.map(g=>`<th>${g.name}</th>`).join('')}</tr>${[['Players','playing'],['Visits','visits'],['Favorites','favorites'],['ID','id']].map(r=>`<tr><td>${r[0]}</td>${compare.map(g=>`<td>${Number(g[r[1]]||0).toLocaleString()}</td>`).join('')}</tr>`).join('')}</table></div>`:card('Chưa có game','Vào Roblox → Game Intelligence → chọn ＋.')}`;
if(tab==='about')body=`<section class="hero"><h1>RBLXFinder</h1><p>Ứng dụng gaming của Noobie. Package: com.noobie.rblxfinder</p></section><div class="grid">${card('Roblox','Profile Scanner · Game Intelligence · Low-Pop Server · Compare · Favorites · Plus tools')}${card('Free Fire','Sensitivity Lab · Device Presets · Aim Challenge · HUD Builder · Creator Support')}${card('Kết nối','YouTube: @noobieroblox_vn<br>Discord: nePuZm3kcu')}</div>`;
if(err)body=`<div class="error">${err}</div>`+body;document.querySelector('#app').innerHTML=body+'<div class="footer">Noobie · © 2026 Noobie · RBLXFinder Android</div>`}
async function askAI(){let q=prompt('Bạn muốn hỏi AI điều gì?');if(!q)return;try{let r=await fetch(AI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q,game:tab==='freefire'?'freefire':'roblox'})});let d=await r.json();alert(d.reply||d.message||'AI chưa trả lời.')}catch(e){alert('AI hiện không kết nối được.')}}render();
</script></body></html>
