<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7faff"><title>RBLXFinder — Noobie Gaming Hub</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#f7faff;color:#101828;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button,a{cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 20% 0,#e7f1ff 0,transparent 28%),linear-gradient(180deg,#f7faff,#fff 65%)}.top{position:sticky;top:0;z-index:50;background:#ffffffed;backdrop-filter:blur(20px);border-bottom:1px solid #e3e9f2;padding:10px}.head{display:flex;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:9px;flex:1}.brand img{width:43px;height:43px;border-radius:14px}.brand b{font-size:20px}.brand small{display:block;color:#2563eb;font-size:8px;font-weight:950;letter-spacing:.14em}.avatar{width:44px;height:44px;border-radius:14px;object-fit:cover;border:2px solid #fff;box-shadow:0 6px 18px #17315d22}.tabs{display:flex;gap:6px;overflow:auto;margin-top:9px;padding-bottom:2px}.tabs button{white-space:nowrap;border:1px solid #dfe6ef;background:#fff;border-radius:12px;padding:8px 10px;font-size:11px;font-weight:900;color:#475467}.tabs button.on{background:#111827;color:#fff;border-color:#111827}.wrap{max-width:980px;margin:auto;padding:14px 11px 82px}.hero{padding:23px;border-radius:25px;background:linear-gradient(135deg,#0b1220,#1d4ed8 65%,#20c8d7);color:#fff;box-shadow:0 20px 55px #1d4ed82b}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.15em;opacity:.75}.hero h1{font-size:34px;line-height:.98;letter-spacing:-.05em;margin:8px 0}.hero em{font-style:normal;color:#8af5ff}.hero p{font-size:13px;line-height:1.6;color:#dbeafe}.actions,.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:900;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:linear-gradient(135deg,#1463ff,#18b9e7);color:#fff}.soft{background:#fff;color:#344054;border:1px solid #dce3ed}.danger{background:#fff0f2;color:#b4233d;border:1px solid #ffd0d8}.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}.game{border:1px solid #e1e7ef;background:#fff;border-radius:19px;padding:10px;text-align:left;box-shadow:0 10px 32px #17315d0d}.gameIcon{height:90px;border-radius:15px;background:#f4f7fb;display:grid;place-items:center}.gameIcon img{width:60px;height:60px;object-fit:contain}.game h2{font-size:18px;margin:9px 3px 3px}.game p{font-size:11px;color:#667085;margin:0 3px 7px}.card{background:#fff;border:1px solid #e1e7ef;border-radius:19px;padding:15px;margin-top:12px;box-shadow:0 10px 32px #17315d0d}.card h2{font-size:17px;margin:0 0 10px}.muted{font-size:12px;color:#667085;line-height:1.55}.input,.select{width:100%;padding:11px;border:1px solid #d7dee8;border-radius:12px;background:#fff;outline:none}.search{display:grid;grid-template-columns:1fr auto;gap:7px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.metric{padding:11px;border:1px solid #e2e8f0;border-radius:13px;background:#f9fbff}.metric span{display:block;color:#667085;font-size:9px;font-weight:850}.metric b{display:block;font-size:19px;margin-top:3px}.user{display:flex;gap:10px;padding:11px;background:#f7faff;border:1px solid #dce7f5;border-radius:14px;margin-top:10px}.user img{width:58px;height:58px;border-radius:14px;object-fit:cover}.user b{display:block}.verified{color:#1677ff;font-size:11px;font-weight:950}.results{display:grid;gap:10px}.result{border:1px solid #e1e7ef;border-radius:16px;padding:9px;background:#fff}.result img{width:100%;aspect-ratio:16/9;border-radius:12px;object-fit:cover}.result h3{font-size:14px;margin:7px 0 3px}.result p{font-size:11px;color:#667085;line-height:1.45;margin:4px 0}.servers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.server{padding:11px;border:1px solid #e1e7ef;border-radius:13px;background:#f9fbff}.server b{font-size:18px}.server code{display:block;color:#667085;font-size:9px;word-break:break-all;margin:4px 0 7px}.plusHero{padding:20px;border-radius:20px;background:linear-gradient(135deg,#28105d,#7c3aed,#d21eac);color:#fff}.plusHero h1{font-size:29px;margin:7px 0}.features{display:grid;grid-template-columns:1fr 1fr;gap:8px}.feature{padding:11px;border:1px solid #e3e8f0;border-radius:12px;background:#f9fbff;font-size:11px;font-weight:900}.creatorGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.creatorBox{padding:13px;border-radius:15px;background:#f8fbff;border:1px solid #dce8f7}.creatorBox b{font-size:13px}.aim{height:180px;border-radius:17px;background:radial-gradient(circle,#dbeafe,#fff);display:grid;place-items:center}.target{width:95px;height:95px;border-radius:50%;border:8px solid #ef4444;background:#fff;font-weight:950}.empty{padding:28px;text-align:center;color:#667085}.notice{padding:10px 12px;border-radius:12px;background:#ecfdf5;border:1px solid #b7ebd0;color:#067647;font-size:12px;font-weight:850}.error{padding:10px 12px;border-radius:12px;background:#fff0f2;border:1px solid #ffd0d8;color:#b4233d;font-size:12px;font-weight:850}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:60;background:#fffffff2;border-top:1px solid #e4eaf2;display:flex;justify-content:space-around;padding:7px 4px env(safe-area-inset-bottom);backdrop-filter:blur(16px)}.bottom button{border:0;background:none;color:#667085;font-size:10px;font-weight:900;padding:5px 8px}.bottom button.on{color:#2563eb}.hidden{display:none!important}@media(max-width:560px){.cards,.creatorGrid{grid-template-columns:1fr}.servers{grid-template-columns:1fr}.features{grid-template-columns:1fr}.avatar{width:41px;height:41px}}
</style></head><body><div class="app"><header class="top"><div class="head"><div class="brand"><img src="rblxfinder-icon.webp" alt="RBLXFinder"><span><b>RBLXFinder</b><small>NOOBIE GAMING HUB</small></span></div><img class="avatar" src="rblxfinder-avatar.webp" alt="Noobie"></div><nav id="tabs" class="tabs"></nav></header><main id="view" class="wrap"></main><nav id="bottom" class="bottom"></nav></div><script>
'use strict';
const BASE='https://repo-ttdo.vercel.app',API=BASE+'/api/roblox',SYNC=BASE+'/api/sync',SB='https://mbsnpcdmenfufhbctoek.supabase.co',KEY='sb_publishable_rwwoH9hpk6cg3woGveNObw_C00pNZsx',RB='khoungbell7777',FF='2035971642',SUPPORT='supportrobloxfinder@gmail.com';
const ROBLOX_ICON='https://www.roblox.com/favicon.ico',FREEFIRE_ICON='https://ff.garena.com/favicon.ico';
const tabs=[['home','Tổng quan'],['roblox','Roblox'],['plus','Plus'],['freefire','Free Fire'],['creator','Creator'],['community','Cộng đồng'],['daily','Daily'],['compare','So sánh'],['account','Tài khoản']];
const ff=[['OPPO A9 2020',180,47,440],['iPhone 11',188,48,0],['iPhone 13',194,49,0],['iPhone 15 Pro',200,50,0],['Samsung A54',192,49,480],['Samsung S24',192,49,520],['Redmi Note 13',182,48,480]];
let state={tab:'home',xp:Number(localStorage.getItem('rblx_xp')||0),streak:Number(localStorage.getItem('rblx_streak')||1),saved:JSON.parse(localStorage.getItem('rblx_saved_games')||'[]'),name:'',user:null,query:'',games:[],selected:null,servers:[],compare:[],plus:false,email:'',password:'',token:localStorage.getItem('rblx_session')||'',accountEmail:'',syncMsg:'',preset:ff[0],hits:0,shots:0,score:0};
const view=document.getElementById('view'),tabsEl=document.getElementById('tabs'),bottom=document.getElementById('bottom');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saveLocal=()=>{localStorage.setItem('rblx_xp',state.xp);localStorage.setItem('rblx_streak',state.streak);localStorage.setItem('rblx_saved_games',JSON.stringify(state.saved))};
const go=t=>{state.tab=t;render()};
async function api(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||d.message||'Roblox API error');return d}
async function robloxUser(){if(!state.name.trim())return;try{const d=await api({action:'username',username:state.name.trim()});state.user=d;state.xp+=10;saveLocal();render()}catch(e){toast(e.message)}}
async function games(){if(!state.query.trim())return;try{const d=await api({action:'games',q:state.query.trim()});state.games=d.games||d.data||[];state.xp+=15;saveLocal();state.tab='games';render()}catch(e){toast(e.message)}}
async function choose(g){state.selected=g;state.tab='game';render();try{const d=await api({action:'servers',universeId:g.universeId});state.servers=(d.data||[]).sort((a,b)=>(a.playing||0)-(b.playing||0));state.xp+=10;saveLocal();render()}catch(e){toast(e.message)}}
function toggleSave(g){const k=String(g.universeId);state.saved=state.saved.includes(k)?state.saved.filter(x=>x!==k):[...state.saved,k];saveLocal();render()}
function toggleCompare(g){state.compare=state.compare.some(x=>x.universeId===g.universeId)?state.compare.filter(x=>x.universeId!==g.universeId):state.compare.length<4?[...state.compare,g]:state.compare;render()}
async function auth(signup){try{const endpoint=signup?'signup':'token?grant_type=password';const r=await fetch(`${SB}/auth/v1/${endpoint}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:state.email.trim(),password:state.password})});const d=await r.json();if(!r.ok||!d.access_token)throw Error(d.error_description||d.msg||'Đăng nhập thất bại');state.token=d.access_token;state.accountEmail=d.user?.email||state.email;localStorage.setItem('rblx_session',state.token);state.password='';await loadCloud();render()}catch(e){toast(e.message)}}
async function loadCloud(){if(!state.token)return;try{const r=await fetch(SYNC,{method:'POST',headers:{Authorization:`Bearer ${state.token}`,'Content-Type':'application/json'},body:JSON.stringify({action:'load'})});const d=await r.json();if(!r.ok)throw Error(d.error);state.accountEmail=d.user?.email||state.accountEmail;const x=d.data||{};if(typeof x.xp==='number')state.xp=x.xp;if(typeof x.streak==='number')state.streak=x.streak;if(Array.isArray(x.savedGames))state.saved=x.savedGames;if(typeof x.plus==='boolean')state.plus=x.plus;saveLocal();state.syncMsg='Đã đồng bộ Web ↔ APK ✓'}catch(e){state.syncMsg=e.message||'Chưa có cloud'}}
async function saveCloud(){if(!state.token)return toast('Hãy đăng nhập tài khoản');try{const r=await fetch(SYNC,{method:'POST',headers:{Authorization:`Bearer ${state.token}`,'Content-Type':'application/json'},body:JSON.stringify({action:'save',data:{xp:state.xp,streak:state.streak,savedGames:state.saved,plus:state.plus,username:state.user?.name||'',updatedAt:new Date().toISOString()}})});const d=await r.json();if(!r.ok)throw Error(d.error);state.syncMsg='Đã lưu cloud ✓';render()}catch(e){toast(e.message)}}
function logout(){state.token='';state.accountEmail='';localStorage.removeItem('rblx_session');state.syncMsg='Đã đăng xuất';render()}
function toast(t){const el=document.createElement('div');el.className='error';el.textContent=t;document.getElementById('view').prepend(el);setTimeout(()=>el.remove(),3200)}
function top(){tabsEl.innerHTML=tabs.map(x=>`<button class="${state.tab===x[0]?'on':''}" data-t="${x[0]}">${x[1]}</button>`).join('');tabsEl.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));bottom.innerHTML=tabs.slice(0,5).map(x=>`<button class="${state.tab===x[0]?'on':''}" data-t="${x[0]}">${x[1]}</button>`).join('');bottom.querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t))}
function render(){top();let h='';if(state.tab==='home')h=`<section class="hero"><span class="eyebrow">NOOBIE · RBLXFINDER V5</span><h1>Roblox + Free Fire.<br><em>Một hệ sinh thái.</em></h1><p>Tìm username, game, server ít người, Plus, Creator, cộng đồng và đồng bộ Web ↔ APK.</p><div class="actions"><button class="btn primary" onclick="go('roblox')">Roblox</button><button class="btn soft" onclick="go('freefire')">Free Fire</button><button class="btn soft" onclick="go('account')">☁ Đồng bộ</button></div></section><div class="cards"><button class="game" onclick="go('roblox')"><div class="gameIcon"><img src="${ROBLOX_ICON}" onerror="this.src='/roblox-thumb.svg'"></div><h2>Roblox</h2><p>Username · Game Search · Low-pop Server · Plus</p></button><button class="game" onclick="go('freefire')"><div class="gameIcon"><img src="${FREEFIRE_ICON}" onerror="this.src='/free-fire-thumb.svg'"></div><h2>Free Fire</h2><p>Sensitivity · Aim Lab · HUD · Creator</p></button></div><div class="metrics"><div class="metric"><span>LEVEL</span><b>${Math.floor(state.xp/100)+1}</b></div><div class="metric"><span>XP</span><b>${state.xp%100}/100</b></div><div class="metric"><span>GAME LƯU</span><b>${state.saved.length}</b></div><div class="metric"><span>STREAK</span><b>🔥 ${state.streak}</b></div></div><section class="card"><h2>⚡ Truy cập nhanh</h2><div class="actions"><button class="btn soft" onclick="go('plus')">⭐ Roblox Plus</button><button class="btn soft" onclick="go('creator')">✓ Creator</button><button class="btn soft" onclick="go('community')">💬 Cộng đồng</button><a class="btn soft" href="mailto:${SUPPORT}?subject=RBLXFinder%20Feedback">✉ Feedback</a></div></section>`;
else if(state.tab==='roblox')h=`<section class="card"><h2>👤 Username Scanner</h2><div class="search"><input id="username" class="input" value="${esc(state.name)}" placeholder="Nhập username Roblox"><button class="btn primary" onclick="state.name=document.getElementById('username').value;robloxUser()">Tìm</button></div>${state.user?`<div class="user"><img src="${state.user.avatarUrl||'/rblxfinder-avatar.webp'}"><div><b>${esc(state.user.displayName)}</b><span class="muted">@${esc(state.user.name)} · ID ${state.user.id}</span><div class="row"><a class="btn soft" href="${state.user.profileUrl}" target="_blank">Profile ↗</a><span class="verified">${state.plus?'✓ Roblox Plus':''}</span></div></div></div>`:''}</section><section class="card"><h2>🎮 Game Search</h2><div class="search"><input id="gameq" class="input" value="${esc(state.query)}" placeholder="Brookhaven, Blox Fruits..."><button class="btn primary" onclick="state.query=document.getElementById('gameq').value;games()">Tìm game</button></div><p class="muted">Chọn game → server public → ít người đứng đầu.</p></section><section class="card"><h2>⭐ Roblox Plus</h2><div class="features">${['Advanced Low-pop','Auto Refresh','Server Watcher','Game Intelligence','Player Trends','Saved Alerts'].map(x=>`<div class="feature">✓ ${x}</div>`).join('')}</div></section>`;
else if(state.tab==='games')h=`<section class="card"><h2>🎮 ${esc(state.query||'Roblox Games')}</h2><div class="results">${state.games.map(g=>`<article class="result"><img src="${g.thumbnailUrl||'/roblox-thumb.svg'}"><h3>${esc(g.name)}</h3><p>${esc(g.description||'Roblox experience')}</p><span class="muted">👥 ${(g.playing||0).toLocaleString()} · ⭐ ${(g.favorites||0).toLocaleString()}</span><div class="actions"><button class="btn primary" onclick='choose(${JSON.stringify(g)})'>Server ít người</button><button class="btn soft" onclick='toggleSave(${JSON.stringify(g)})'>${state.saved.includes(String(g.universeId))?'★':'☆'} Lưu</button><button class="btn soft" onclick='toggleCompare(${JSON.stringify(g)})'>＋ So sánh</button></div></article>`).join('')||'<div class="empty">Không có kết quả.</div>'}</div></section>`;
else if(state.tab==='game')h=`<section class="card"><h2>${esc(state.selected?.name||'Game')}</h2><div class="row">${state.selected?`<img src="${state.selected.thumbnailUrl||'/roblox-thumb.svg'}" style="width:145px;border-radius:14px"><div><p class="muted">Universe ${state.selected.universeId} · Place ${state.selected.rootPlaceId}</p><a class="btn soft" href="https://www.roblox.com/games/${state.selected.rootPlaceId}" target="_blank">Mở Roblox ↗</a></div>`:''}</div></section><section class="card"><h2>🖥️ Server ít người</h2><div class="servers">${state.servers.map(s=>`<div class="server"><b>${s.playing??'?'} / ${s.maxPlayers??'?'}</b><code>${esc(s.id)}</code><div class="row"><button class="btn soft" onclick="navigator.clipboard?.writeText('${String(s.id).replace(/'/g,"\\'")}')">Copy ID</button><a class="btn soft" href="https://www.roblox.com/games/start?placeId=${state.selected?.rootPlaceId}&gameInstanceId=${encodeURIComponent(s.id)}" target="_blank">Vào ↗</a></div></div>`).join('')||'<div class="empty">Không có server phù hợp.</div>'}</div></section>`;
else if(state.tab==='plus')h=`<section class="plusHero"><span class="eyebrow">RBLXFINDER PLUS</span><h1>Advanced Roblox.</h1><p>Core Roblox tools vẫn miễn phí. Plus mở công cụ nâng cao.</p></section><section class="card"><div class="features">${['Advanced Low-pop Filters','Auto Refresh','Server Watcher','New-server Detection','Saved Server Alerts','Game Intelligence','Compare Games','Player Trends','Profile Intelligence','Shortcuts'].map(x=>`<div class="feature">✓ ${x}</div>`).join('')}</div></section><section class="card"><h2>💎 Nhận Plus</h2><p class="muted">Donate Robux cho <b>${RB}</b>. Creator xác nhận donation thủ công rồi cấp Plus.</p><a class="btn primary" href="https://www.roblox.com/search/users?keyword=${RB}" target="_blank">Mở Creator ↗</a></section>`;
else if(state.tab==='freefire')h=`<section class="card"><h2>🔥 Free Fire Lab</h2><select id="preset" class="select" onchange="state.preset=ff.find(x=>x[0]===this.value)||ff[0];render()">${ff.map(p=>`<option>${p[0]}</option>`).join('')}</select><div class="metrics"><div class="metric"><span>GENERAL</span><b>${state.preset[1]}</b></div><div class="metric"><span>RED DOT</span><b>${state.preset[2]}</b></div><div class="metric"><span>DPI</span><b>${state.preset[3]||'Auto'}</b></div></div><button class="btn primary" onclick="navigator.clipboard?.writeText('Free Fire ${state.preset[0]} | General ${state.preset[1]} | Red Dot ${state.preset[2]} | DPI ${state.preset[3]||'Auto'}')">📋 Copy preset</button></section><section class="card"><h2>🎯 Aim Challenge</h2><div class="aim"><button class="target" onclick="state.shots++;if(Math.random()>.22){state.hits++;state.score=Math.min(100,state.score+4);state.xp+=2;saveLocal()}else state.score=Math.max(0,state.score-1);render()">TARGET</button></div><div class="metrics"><div class="metric"><span>SCORE</span><b>${state.score}</b></div><div class="metric"><span>HITS</span><b>${state.hits}</b></div><div class="metric"><span>SHOTS</span><b>${state.shots}</b></div></div></section><section class="card"><h2>💎 Free Fire Creator</h2><p class="muted">Creator ID: <b>${FF}</b>. Free Fire không có Plus.</p><a class="btn soft" href="mailto:${SUPPORT}?subject=Free%20Fire%20Feedback">✉ Feedback</a></section>`;
else if(state.tab==='creator')h=`<section class="card"><h2>👑 Creator Center</h2><p class="muted">Roblox Creator: <b>${RB}</b><br>Free Fire Creator ID: <b>${FF}</b></p><div class="creatorGrid"><div class="creatorBox"><b>✓ Roblox Creator</b><p class="muted">Plus, donation xác nhận thủ công và tích xanh RBLXFinder.</p></div><div class="creatorBox"><b>✓ Free Fire Creator</b><p class="muted">Quản lý Creator ID và cộng đồng.</p></div></div><a class="btn primary" href="${BASE}/creator/" target="_blank">Mở Creator Dashboard →</a></section>`;
else if(state.tab==='community')h=`<section class="card"><h2>💬 Cộng đồng</h2><p class="muted">Roblox + Free Fire: posts, likes, comments, media và feedback.</p><div class="creatorGrid"><div class="creatorBox"><b>Roblox Community</b><p class="muted">Chia sẻ game, server, mẹo.</p></div><div class="creatorBox"><b>Free Fire Community</b><p class="muted">Sensitivity, HUD, preset.</p></div></div><a class="btn soft" href="mailto:${SUPPORT}?subject=RBLXFinder%20Community%20Feedback">✉ Gửi feedback</a></section>`;
else if(state.tab==='daily')h=`<section class="card"><h2>🎯 Daily Challenges</h2><div class="features"><div class="feature">+10 XP · Tìm username</div><div class="feature">+15 XP · Tìm game</div><div class="feature">+10 XP · Tìm server</div><div class="feature">+5 XP · Aim Lab</div></div><p class="muted">Streak: 🔥 ${state.streak} · XP: ${state.xp}</p></section>`;
else if(state.tab==='compare')h=`<section class="card"><h2>⚖ So sánh game</h2><div class="results">${state.compare.map(g=>`<div class="result"><img src="${g.thumbnailUrl||'/roblox-thumb.svg'}"><h3>${esc(g.name)}</h3><p>Players: ${(g.playing||0).toLocaleString()} · Visits: ${(g.visits||0).toLocaleString()}</p></div>`).join('')||'<div class="empty">Chọn game rồi bấm So sánh.</div>'}</div></section>`;
else if(state.tab==='account')h=`<section class="card"><h2>☁ Tài khoản & đồng bộ Web ↔ APK</h2>${state.token?`<div class="notice">${esc(state.accountEmail||'Đã đăng nhập')} · ${esc(state.syncMsg||'Sẵn sàng')}</div><div class="actions"><button class="btn primary" onclick="saveCloud()">☁ Lưu cloud</button><button class="btn soft" onclick="loadCloud().then(render)">↻ Tải cloud</button><button class="btn soft" onclick="logout()">Đăng xuất</button></div>`:`<input id="email" class="input" placeholder="Email" value="${esc(state.email)}"><input id="pass" class="input" type="password" placeholder="Mật khẩu tối thiểu 6 ký tự" value="${esc(state.password)}"><div class="actions"><button class="btn primary" onclick="state.email=document.getElementById('email').value;state.password=document.getElementById('pass').value;auth(false)">Đăng nhập</button><button class="btn soft" onclick="state.email=document.getElementById('email').value;state.password=document.getElementById('pass').value;auth(true)">Tạo tài khoản</button></div>`}<p class="muted">Cloud lưu XP, streak, game đã lưu, Plus và username. Đăng nhập cùng tài khoản trên Web và APK để đồng bộ.</p></section>`;
view.innerHTML=h}
render();if(state.token)loadCloud().then(render);</script></body></html>
