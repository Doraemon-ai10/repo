workflows:
  rblxfinder-android-debug:
    name: RBLXFinder Android APK v3.0.0
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Prepare Android SDK path
        script: |
          set -eux
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > "$CM_BUILD_DIR/android/local.properties"
      - name: Check Android project
        script: |
          set -eux
          test -s android/settings.gradle.kts
          test -s android/build.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/java/com/noobie/rblxfinder/MainActivity.kt
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/rblxfinder-icon.webp
          test -s android/app/src/main/res/drawable/rblxfinder_icon.webp
      - name: Build installable debug APK
        script: |
          set -eux
          gradle -p android :app:assembleDebug --no-daemon --stacktrace
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p apk-output
          cp "$APK" "apk-output/RBLXFinder-Noobie-v3.0.0-debug.apk"
          ls -lh "apk-output/RBLXFinder-Noobie-v3.0.0-debug.apk"
    artifacts:
      - apk-output/RBLXFinder-Noobie-v3.0.0-debug.apk
      - android/app/build/outputs/apk/debug/app-debug.apk
